<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeno playground</title>
<meta name="description" content="Write a Zeno program and run it in your browser, with nothing to install.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  The Zeno playground: write a program, press Run, and see it run, all in
  this one page. `zeno playground` writes it (src/main.rs), putting in
  Zeno itself (zeno.wasm, packed), src/web.js and a few of the examples.

  Nothing is sent anywhere. The program is checked and run by the same
  Zeno as `zeno run`, in the browser. Each run gets a fresh frame on the
  right, which is the page the program is in: `import web` reaches it.
  docs/playground.md walks through how it works.
-->
<style>
  /* The colours of zeno-lang.org: navy-tinted greys, cobalt blue. */
  :root {
    --paper: #f6f7fb; --ink: #141a2e; --soft: #5b6380; --line: #dde1ec;
    --panel: #ffffff; --accent: #2f5bea; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0a0a0a; --ink: #ececec; --soft: #9a9a9a; --line: #2a2a2a;
      --panel: #141414; --accent: #7d9cff; --accent-ink: #0a0a0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font: 16px/1.4 system-ui, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 span { color: var(--soft); font-weight: normal; }
  header nav { display: flex; gap: 14px; margin-left: auto; font-size: 14px; }
  header nav a { color: var(--soft); text-decoration: none; }
  header nav a:hover { color: var(--accent); }
  select, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px;
  }
  button { cursor: pointer; }
  #run { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  #said { color: var(--soft); font-size: 14px; }
  main { flex: 1; display: flex; min-height: 0; }
  .side { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .side + .side { border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border-bottom: none; border-radius: 6px 6px 0 0; background: transparent; color: var(--soft); }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); }
  .tabs .label { padding: 5px 4px; color: var(--soft); font-size: 14px; }
  textarea {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0; padding: 14px 16px;
    background: var(--panel); color: var(--ink); tab-size: 4; white-space: pre; overflow: auto;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  iframe { flex: 1; width: 100%; border: 0; background: white; }
  @media (max-width: 760px) {
    header { gap: 8px 10px; padding: 8px 12px; }
    header h1 { order: 0; }
    header nav { order: 1; }
    header > :not(h1):not(nav) { order: 2; }
    #choose { flex: 1 1 140px; display: flex; min-width: 0; }
    #choose span { display: none; }
    #choose select { flex: 1; min-width: 0; }
    main { flex-direction: column; }
    .side { min-height: 40vh; }
    .side + .side { border-left: 0; border-top: 1px solid var(--line); }
    #said { display: none; }
    /* A phone zooms in on a box whose letters are smaller than 16px. */
    textarea, select { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="https://zeno-lang.org/">Zeno</a> <span>playground</span></h1>
  <label id="choose"><span>Example</span> <select id="examples" aria-label="Example"></select></label>
  <button id="run" title="Ctrl+Enter">Run</button>
  <button id="link" title="A link to this program, to send to somebody">Copy link</button>
  <span id="said"></span>
  <nav>
    <a href="https://zeno-lang.org/learn/">Learn</a>
    <a href="https://zeno-lang.org/book/">Book</a>
    <a href="https://zeno-lang.org/docs/">Docs</a>
  </nav>
</header>
<main>
  <div class="side">
    <div class="tabs" role="tablist">
      <button id="tab-program" role="tab" aria-selected="true">Program</button>
      <button id="tab-page" role="tab" aria-selected="false">Page (HTML)</button>
    </div>
    <textarea id="program" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="The program"></textarea>
    <textarea id="page" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="The page, in HTML" hidden></textarea>
  </div>
  <div class="side">
    <div class="tabs"><span class="label">What it does</span></div>
    <iframe id="result" title="The program, running"></iframe>
  </div>
</main>

const WEB_JS = "// Starts a Zeno program in a page.\n//\n// `zeno build --web` puts this file into the page it writes, with the\n// program and with `zeno.wasm`, which is Zeno itself built for a browser\n// (src/web_host.rs). The last line of the page calls `Zeno.start`.\n//\n// WebAssembly cannot touch a page. It can only call the functions it is\n// given when it starts. This file is those functions: the ones that show\n// what a program prints, and the ones that do what the `web` module\n// asks (`ops`, below). It also goes the other way: when a button is\n// pressed, it calls the function of the program that `on` was given.\n//\n// Text crosses between the two as a place in the program's memory and a\n// length in bytes, in UTF-8. docs/web.md walks through all of it.\n\n(function () {\n  \"use strict\";\n\n  const decoder = new TextDecoder();\n  const encoder = new TextEncoder();\n\n  let zeno = null;      // what zeno.wasm lets the page call\n  let stopped = false;  // an error ended the program: call nothing more\n  let running = false;  // the program is in the middle of something\n  const waiting = [];   // calls that arrived while it was\n\n  // The program knows an element by a number. This is which is which.\n  const elements = [];\n  // The timers that are waiting, by the number of their function.\n  const timers = {};\n  const numbers = new Map();\n\n  function numberOf(element) {\n    if (!element) return null;\n    if (!numbers.has(element)) {\n      numbers.set(element, elements.length);\n      elements.push(element);\n    }\n    return numbers.get(element);\n  }\n\n  // The text the program put at `place`.\n  function read(place, length) {\n    return decoder.decode(new Uint8Array(zeno.memory.buffer, place, length));\n  }\n\n  // Put text where the program can read it. The program frees the room.\n  function give(text) {\n    const bytes = encoder.encode(text);\n    const place = zeno.zeno_alloc(bytes.length);\n    new Uint8Array(zeno.memory.buffer, place, bytes.length).set(bytes);\n    return [place, bytes.length];\n  }\n\n  // An answer to the program: four bytes that say how long it is, and\n  // then the answer as JSON.\n  function answer(value) {\n    const bytes = encoder.encode(JSON.stringify(value === undefined ? null : value));\n    const place = zeno.zeno_alloc(4 + bytes.length);\n    new DataView(zeno.memory.buffer).setUint32(place, bytes.length, true);\n    new Uint8Array(zeno.memory.buffer, place + 4, bytes.length).set(bytes);\n    return place;\n  }\n\n  // What `print` prints goes to the browser's console, and into the\n  // element with the id `zeno-output` if the page has one.\n  let line = \"\";\n  function print(text) {\n    line += text;\n    while (line.includes(\"\\n\")) {\n      const end = line.indexOf(\"\\n\");\n      console.log(line.slice(0, end));\n      line = line.slice(end + 1);\n    }\n    const output = document.getElementById(\"zeno-output\");\n    if (output) output.textContent += text;\n  }\n\n  // An error that nothing caught stops the program, as it does under\n  // `zeno run`. It is shown at the foot of the page, where it cannot\n  // be missed.\n  function error(text) {\n    stopped = true;\n    console.error(text);\n    let box = document.getElementById(\"zeno-error\");\n    if (!box) {\n      box = document.createElement(\"pre\");\n      box.id = \"zeno-error\";\n      box.style.cssText =\n        \"position:fixed;left:0;right:0;bottom:0;margin:0;padding:12px 16px;max-height:40%;\" +\n        \"overflow:auto;background:#fff0f0;color:#900;border-top:2px solid #c00;\" +\n        \"font:14px/1.4 ui-monospace,monospace;white-space:pre-wrap;z-index:99999\";\n      document.body.appendChild(box);\n    }\n    box.textContent += text;\n  }\n\n  // Run something of the program's. If the program is already in the\n  // middle of something, this waits its turn.\n  function run(step) {\n    if (stopped) return;\n    if (running) {\n      waiting.push(step);\n      return;\n    }\n    running = true;\n    try {\n      step();\n    } catch (trap) {\n      // Not a mistake in the program: Zeno itself fell over.\n      error(\"Zeno itself stopped, which is a bug in Zeno and not in this program: \" + trap + \"\\n\");\n    }\n    running = false;\n    if (waiting.length > 0) run(waiting.shift());\n  }\n\n  // Call a function the program gave to `on`, `after`, `on_key` or\n  // `fetch`. `carried` is what the call hands over, if anything:\n  // {key: \"Enter\"}, {event: {...}} or {reply: [200, \"...\"]}.\n  function call(handler, carried) {\n    run(function () {\n      if (carried === undefined) zeno.zeno_call(handler);\n      else zeno.zeno_call_with(handler, ...give(JSON.stringify(carried)));\n    });\n  }\n\n  // How the program shows an element when it prints one: `#count` if it\n  // has an id, and `\u003cli>` if not.\n  function nameOf(element) {\n    return element.id ? \"#\" + element.id : \"\u003c\" + element.tagName.toLowerCase() + \">\";\n  }\n\n  // What the program is told of an event. The place of the mouse is\n  // counted from the top left corner of the element `on` was given to.\n  function told(happened, kind, element) {\n    const box = element.getBoundingClientRect();\n    const mouse = typeof happened.clientX === \"number\";\n    const target = happened.target instanceof Element ? happened.target : element;\n    return {\n      kind: kind,\n      target: numberOf(target),\n      name: nameOf(target),\n      x: mouse ? happened.clientX - box.left : 0,\n      y: mouse ? happened.clientY - box.top : 0,\n      key: typeof happened.key === \"string\" ? happened.key : \"\",\n    };\n  }\n\n  // Drawing on a \u003ccanvas>. `n` is the numbers and `words` the text and\n  // the colour, which comes last.\n  function draw(canvas, what, n, words) {\n    if (!(canvas instanceof HTMLCanvasElement)) return false;\n    const pen = canvas.getContext(\"2d\");\n    const colour = words[words.length - 1];\n    pen.fillStyle = colour;\n    pen.strokeStyle = colour;\n    if (what === \"rect\") {\n      pen.fillRect(n[0], n[1], n[2], n[3]);\n    } else if (what === \"circle\") {\n      pen.beginPath();\n      pen.arc(n[0], n[1], n[2], 0, 2 * Math.PI);\n      pen.fill();\n    } else if (what === \"line\") {\n      pen.beginPath();\n      pen.moveTo(n[0], n[1]);\n      pen.lineTo(n[2], n[3]);\n      pen.stroke();\n    } else if (what === \"text\") {\n      // The text is in the canvas's own font, as CSS gave it, and the\n      // place is its top left corner, as it is for a rectangle.\n      pen.font = getComputedStyle(canvas).font;\n      pen.textBaseline = \"top\";\n      pen.fillText(words[0], n[0], n[1]);\n    } else {\n      pen.clearRect(0, 0, canvas.width, canvas.height);\n    }\n    return true;\n  }\n\n  // What is kept between visits. A browser may refuse to keep anything\n  // (a private window, a setting), and then nothing is kept.\n  function kept(does) {\n    try {\n      return does(window.localStorage);\n    } catch (refused) {\n      return null;\n    }\n  }\n\n  // What the `web` module asks of the page. Each is named in a request\n  // such as [\"set_text\", 3, \"Hello\"], and what it returns is the answer.\n  const ops = {\n    element: (selector) => numberOf(document.querySelector(selector)),\n    elements: (selector) => Array.from(document.querySelectorAll(selector), numberOf),\n    create: (tag, text) => {\n      const element = document.createElement(tag);\n      element.textContent = text;\n      return numberOf(element);\n    },\n    text: (id) => elements[id].textContent,\n    set_text: (id, text) => { elements[id].textContent = text; },\n    value: (id) => String(elements[id].value ?? \"\"),\n    set_value: (id, value) => { elements[id].value = value; },\n    get: (id, name) => elements[id].getAttribute(name),\n    set: (id, name, value) => { elements[id].setAttribute(name, value); },\n    has_class: (id, name) => elements[id].classList.contains(name),\n    add_class: (id, name) => { elements[id].classList.add(name); },\n    remove_class: (id, name) => { elements[id].classList.remove(name); },\n    show: (id) => { elements[id].hidden = false; },\n    hide: (id) => { elements[id].hidden = true; },\n    is_inside: (inner, outer) => elements[outer].contains(elements[inner]),\n    append: (parent, child) => { elements[parent].appendChild(elements[child]); },\n    remove: (id) => { elements[id].remove(); },\n    clear: (id) => { elements[id].replaceChildren(); },\n    name: (id) => nameOf(elements[id]),\n    get_style: (id, name) => elements[id].style.getPropertyValue(name) || null,\n    set_style: (id, name, value) => {\n      // `font-size` is `fontSize` to the browser, which is how it is\n      // asked whether there is such a style.\n      const asked = name.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());\n      if (!name.startsWith(\"--\") && !(asked in elements[id].style)) return false;\n      elements[id].style.setProperty(name, value);\n      return true;\n    },\n    draw: (id, what, numbers, words) => draw(elements[id], what, numbers, words),\n    save: (name, value) => { kept((store) => store.setItem(name, value)); },\n    load: (name) => kept((store) => store.getItem(name)),\n    forget: (name) => { kept((store) => store.removeItem(name)); },\n    on: (id, event, handler) => {\n      const element = elements[id];\n      element.addEventListener(event, function (happened) {\n        // A form that is sent loads the page again, and the program\n        // with it. The program is asked what to do instead.\n        if (event === \"submit\") happened.preventDefault();\n        call(handler, { event: told(happened, event, element) });\n      });\n    },\n    // A timer is known by the number of its function, which is its\n    // own: `stop` is given that number.\n    after: (milliseconds, handler) => { timers[handler] = setTimeout(() => call(handler), milliseconds); },\n    every: (milliseconds, handler) => { timers[handler] = setInterval(() => call(handler), milliseconds); },\n    // The browser keeps one row of numbers for both kinds, so one\n    // call stops either. One that has stopped, or been called, is left.\n    stop: (handler) => { clearTimeout(timers[handler]); },\n    on_key: (handler) => {\n      document.addEventListener(\"keydown\", (pressed) => call(handler, { key: pressed.key }));\n    },\n    // The answer of the network comes later, and the program is called\n    // with it then. An address that cannot be reached answers 0.\n    fetch: (address, body, handler) => {\n      const how = body === null ? {} : { method: \"POST\", body: body };\n      fetch(address, how)\n        .then((answered) => answered.text().then((text) => call(handler, { reply: [answered.status, text] })))\n        .catch(() => call(handler, { reply: [0, \"\"] }));\n    },\n  };\n\n  // What zeno.wasm is given when it starts (see src/web_host.rs).\n  const host = {\n    zeno_host_print: (place, length) => print(read(place, length)),\n    zeno_host_error: (place, length) => error(read(place, length)),\n    zeno_host_page: (place, length) => {\n      const [op, ...rest] = JSON.parse(read(place, length));\n      let result = null;\n      try {\n        result = ops[op](...rest);\n      } catch (refused) {\n        // A selector the browser cannot read, for one. The program is\n        // told there is nothing there.\n        result = null;\n      }\n      return answer(result);\n    },\n    zeno_host_input: (place, length) => answer(window.prompt(read(place, length))),\n    zeno_host_now: () => performance.now(),\n  };\n\n  // `wasm` is the bytes of zeno.wasm, or zeno.wasm as the browser has\n  // already read it in (a WebAssembly.Module, which the playground\n  // makes once for every program it runs). `program` names the first\n  // file and holds the text of every file:\n  // {main: \"counter.zeno\", files: {...}}.\n  async function start(wasm, program) {\n    const made = await WebAssembly.instantiate(await const EXAMPLES = [{"name":"Hello","program":"# The whole program. No main(), no imports, no semicolons.\nprint(\"Hello, Zeno!\")\n","page":""},{"name":"A tour of the language","program":"# tour.zeno: a sketch of what Zeno might look like. Nothing here is final.\n#\n# Two rules:\n#   1. Words over symbols. Keywords are whole words you can read aloud.\n#   2. Punctuation has to earn its place. Braces mark blocks, and that's\n#      about it: no semicolons, no colons after if/for, no brackets around conditions.\n\nfrom math import sqrt\n\n# --- Variables: say once whether a value can change ---\n\nlet name = \"Zeno\"                      # let: set once, never changes\nvar count = 3                          # var: can change later\ncount = count + 1                      # plain = updates an existing variable\nlet ports: list[int] = [80, 443, 8080]  # write the type only when you want to\n\nconst PI = 3.14159                     # const: fixed when the program is built\n\n# --- Functions ---\n\nfunction greet(who: str, excited: bool = false) -> str {\n    if excited {\n        return f\"Hello, {who}!\"\n    }\n    return f\"Hello, {who}.\"\n}\n\n# --- Classes: fields at the top, methods below ---\n\nclass Point {\n    x: float\n    y: float\n\n    function distance_to(self, other: Point) -> float {\n        return sqrt((self.x - other.x) ** 2 + (self.y - other.y) ** 2)\n    }\n}\n\nlet origin = Point(0.0, 0.0)\nlet here = Point(x=3.0, y=4.0)\n\n# --- Enums that carry data, and match to take them apart ---\n\nenum Shape {\n    Circle(radius: float)\n    Rect(width: float, height: float)\n}\n\nfunction area(shape: Shape) -> float {\n    match shape {\n        case Circle(r) { return PI * r * r }\n        case Rect(w, h) { return w * h }\n    }\n    # Forget a case and the compiler tells you, before the program ever runs.\n}\n\n# --- Errors: try / except / raise, but checked ---\n\nfunction parse_port(text: str) -> int raises ValueError {\n    let port = int(text)               # int() may raise ValueError; it passes up\n    if not 1 \u003c= port \u003c= 65535 {        # comparisons chain, as in maths\n        raise ValueError(\"port out of range\")\n    }\n    return port\n}\n\ntry {\n    let port = parse_port(\"8080\")\n    print(f\"listening on {port}\")\n} except ValueError as err {\n    print(f\"error: {err}\")\n}\n# Under the hood a `try` remembers one place to jump back to. There are no\n# unwinding tables as in C++, so it is cheap enough for a microcontroller.\n\n# --- No surprise none ---\n\nfunction find_user(id: int) -> str or none {\n    if id == 1 {\n        return \"partha\"\n    }\n    return none\n}\n\nlet user = find_user(2)\nif user is not none {\n    print(user.upper())                # allowed only inside this check\n}\n\n# --- Loops ---\n\nfor shape in [Circle(1.0), Rect(2.0, 3.0)] {\n    print(f\"area = {area(shape):.2f}\")\n}\n\nvar tries = 0\nwhile tries \u003c 3 and ports[tries] != 8080 {\n    tries += 1\n}\n\nlet squares = [n * n for n in range(10) if n % 2 == 0]\nprint(greet(name, excited=true), count, squares, origin.distance_to(here))\n\n# --- Functions are values, and units are types ---\n\nfunction twice(f: function(int) -> int, x: int) -> int {\n    return f(f(x))\n}\n\nfunction describe(delay: ms) -> str {    # only a quantity in ms is accepted\n    return f\"waiting {delay}\"\n}\n\nprint(twice(function(n) { return n * 3 }, 2), describe(500 ms))\n","page":""},{"name":"Primes","program":"# primes.zeno: a program small enough for `zeno build` to compile today.\n#\n#     zeno run examples/primes.zeno      run it with the interpreter\n#     zeno build examples/primes.zeno    compile it to primes.c and ./primes\n#     zeno build --llvm examples/primes.zeno    the same through LLVM IR (primes.ll)\n#\n# All three must print exactly the same thing. No types are written anywhere:\n# the checker works them out, and the C that comes out is fully typed.\n\nfunction is_prime(n) {\n    if n \u003c 2 {\n        return false\n    }\n    var d = 2\n    while d * d \u003c= n {\n        if n % d == 0 {\n            return false\n        }\n        d += 1\n    }\n    return true\n}\n\nfunction count_primes(limit) {\n    var count = 0\n    for n in range(limit) {\n        if is_prime(n) {\n            count += 1\n        }\n    }\n    return count\n}\n\nfunction average_gap(limit) {\n    return limit / count_primes(limit)\n}\n\nlet limit = 10000\nprint(f\"primes below {limit}: {count_primes(limit)}\")\nprint(f\"one in every {average_gap(limit):.2f} numbers\")\n\nvar largest = limit\nwhile not is_prime(largest) {\n    largest -= 1\n}\nprint(f\"the largest is {largest}, or {largest:x} in hex\")\n","page":""},{"name":"A page: things to do","program":"# A list of things to do, in a page.\n#\n# The page is `todo.html`, beside this file: a form with a box to type\n# in, an empty list, and a line that says how much is left. This program\n# is what the page does.\n#\n#     zeno build --web examples/todo.zeno    writes todo.web.html: open it\n#     zeno run examples/todo.zeno            runs it here, on a simulated page\n#     zeno test examples/todo.zeno           runs its tests\nimport web\n\nlet form = web.element(\"#add\")\nlet box = web.element(\"#what\")\nlet list = web.element(\"#list\")\nlet left = web.element(\"#left\")\n\n# How many things are not done yet.\nvar remaining = 0\n\nfunction show_remaining() {\n    if remaining == 1 {\n        left.text = \"1 thing left\"\n    } else {\n        left.text = f\"{remaining} things left\"\n    }\n}\n\n# Put one thing on the list. A click on it marks it done, and another\n# click takes that back.\nfunction add(what: str) {\n    let item = web.create(\"li\", what)\n    item.on(\"click\", function() {\n        if item.has_class(\"done\") {\n            item.remove_class(\"done\")\n            remaining += 1\n        } else {\n            item.add_class(\"done\")\n            remaining -= 1\n        }\n        show_remaining()\n    })\n    list.append(item)\n    remaining += 1\n    show_remaining()\n}\n\n# The form was sent: Enter in the box, or the Add button.\nfunction sent() {\n    let what = box.value.strip()\n    if what != \"\" {\n        add(what)\n        box.value = \"\"\n    }\n}\n\nform.on(\"submit\", sent)\n\n# Escape empties the box.\nweb.on_key(function(key: str) {\n    if key == \"Escape\" {\n        box.value = \"\"\n    }\n})\n\nadd(\"Read docs/web.md\")\nadd(\"Build this page\")\n\ntest \"a thing that is added is left to do\" {\n    let before = remaining\n    add(\"Water the plants\")\n    assert remaining == before + 1\n    assert left.text == f\"{remaining} things left\"\n}\n\ntest \"an empty box adds nothing\" {\n    let before = remaining\n    box.value = \"   \"\n    sent()\n    assert remaining == before\n}\n","page":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Things to do\u003c/title>\n\u003cstyle>\n  body { font: 18px/1.5 system-ui, sans-serif; max-width: 28em; margin: 3em auto; padding: 0 1em; }\n  form { display: flex; gap: 0.5em; }\n  input { flex: 1; font: inherit; padding: 0.3em 0.5em; }\n  button { font: inherit; padding: 0.3em 1em; }\n  ul { padding: 0; list-style: none; }\n  li { padding: 0.4em 0.2em; border-bottom: 1px solid #ddd; cursor: pointer; }\n  li.done { color: #999; text-decoration: line-through; }\n  #left { color: #666; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch1>Things to do\u003c/h1>\n\u003cform id=\"add\">\n  \u003cinput id=\"what\" placeholder=\"What is to be done?\" autofocus>\n  \u003cbutton>Add\u003c/button>\n\u003c/form>\n\u003cul id=\"list\">\u003c/ul>\n\u003cp id=\"left\">\u003c/p>\n\u003c/body>\n\u003c/html>\n"},{"name":"A page: sketch with the mouse","program":"# A sheet to draw on with the mouse, in a page.\n#\n# The page is `sketch.html`, beside this file: four buttons that are\n# colours, a button that wipes the sheet, and a `\u003ccanvas>`, which is an\n# element a program can draw on.\n#\n#     zeno build --web examples/sketch.zeno    writes sketch.web.html: open it\n#     zeno run examples/sketch.zeno            runs it here, on a simulated page\n#     zeno test examples/sketch.zeno           runs its tests\n#\n# It shows what `todo.zeno` does not: a function that asks for the\n# `Event` to learn where the mouse is, drawing, the style of one\n# element, and something that is kept from one visit to the next.\nimport web\n\nlet paper = web.element(\"#paper\")\nlet lines = web.element(\"#lines\")\n\n# The colour that is drawn in. The one chosen on the last visit, if\n# there was a visit.\nvar colour = \"black\"\nlet kept = web.load(\"sketch colour\")\nif kept is not none {\n    colour = kept\n}\n\n# Is the button of the mouse down, and where the mouse was last.\nvar drawing = false\nvar last_x = 0.0\nvar last_y = 0.0\nvar drawn = 0\n\nfunction show_drawn() {\n    lines.text = f\"{drawn} lines drawn\"\n    lines.set_style(\"color\", colour)\n}\n\n# Each colour button says which colour it is in the page itself, as\n# `data-colour`. The one that is chosen gets a black edge, which is a\n# class, and the look of the class is CSS.\nfunction choose(wanted: str) {\n    colour = wanted\n    web.save(\"sketch colour\", colour)\n    for button in web.elements(\".colour\") {\n        if button.get(\"data-colour\") == colour {\n            button.add_class(\"chosen\")\n        } else {\n            button.remove_class(\"chosen\")\n        }\n    }\n    show_drawn()\n}\n\nfor button in web.elements(\".colour\") {\n    let its = button.get(\"data-colour\")\n    if its is not none {\n        button.set_style(\"background-color\", its)\n        button.on(\"click\", function() { choose(its) })\n    }\n}\n\n# The mouse went down on the sheet: a line starts here.\nfunction pen_down(event: Event) {\n    drawing = true\n    last_x = event.x\n    last_y = event.y\n}\n\n# The mouse moved. With the button down, that is a line from where it\n# was to where it is.\nfunction pen_moved(event: Event) {\n    if drawing {\n        paper.draw_line(last_x, last_y, event.x, event.y, colour)\n        last_x = event.x\n        last_y = event.y\n        drawn += 1\n        show_drawn()\n    }\n}\n\nfunction pen_up() {\n    drawing = false\n}\n\nfunction wipe() {\n    paper.erase()\n    drawn = 0\n    show_drawn()\n    paper.draw_text(10, 10, \"Draw here\", \"silver\")\n}\n\npaper.on(\"mousedown\", pen_down)\npaper.on(\"mousemove\", pen_moved)\npaper.on(\"mouseup\", pen_up)\npaper.on(\"mouseleave\", pen_up)\nweb.element(\"#wipe\").on(\"click\", wipe)\n\nchoose(colour)\nwipe()\n\ntest \"the mouse draws only while its button is down\" {\n    let before = drawn\n    paper.fire(\"mousemove\")\n    assert drawn == before\n    paper.fire(\"mousedown\")\n    paper.fire(\"mousemove\")\n    paper.fire(\"mousemove\")\n    assert drawn == before + 2\n    paper.fire(\"mouseup\")\n    paper.fire(\"mousemove\")\n    assert drawn == before + 2\n}\n\ntest \"a colour that is chosen is kept\" {\n    choose(\"crimson\")\n    assert web.load(\"sketch colour\") == \"crimson\"\n    assert lines.get_style(\"color\") == \"crimson\"\n}\n\ntest \"wiping starts the count again\" {\n    paper.fire(\"mousedown\")\n    paper.fire(\"mousemove\")\n    web.element(\"#wipe\").fire(\"click\")\n    assert drawn == 0\n}\n","page":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Sketch\u003c/title>\n\u003cstyle>\n  body { font: 18px/1.5 system-ui, sans-serif; max-width: 30em; margin: 2em auto; padding: 0 1em; }\n  canvas { border: 1px solid #999; cursor: crosshair; font: 16px system-ui, sans-serif; touch-action: none; }\n  button { font: inherit; padding: 0.2em 0.8em; }\n  .colour { width: 2em; height: 2em; padding: 0; border: 3px solid white; outline: 1px solid #999; }\n  .colour.chosen { border-color: black; }\n  #lines { color: #666; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch1>Sketch\u003c/h1>\n\u003cp>\n  \u003cbutton class=\"colour\" data-colour=\"black\" title=\"black\">\u003c/button>\n  \u003cbutton class=\"colour\" data-colour=\"crimson\" title=\"red\">\u003c/button>\n  \u003cbutton class=\"colour\" data-colour=\"royalblue\" title=\"blue\">\u003c/button>\n  \u003cbutton class=\"colour\" data-colour=\"seagreen\" title=\"green\">\u003c/button>\n  \u003cbutton id=\"wipe\">Wipe\u003c/button>\n\u003c/p>\n\u003ccanvas id=\"paper\" width=\"480\" height=\"320\">\u003c/canvas>\n\u003cp id=\"lines\">\u003c/p>\n\u003c/body>\n\u003c/html>\n"}];         // [{name, program, page}]

// The page of a program that has none: what it prints, and under it,
// the error that stopped it, if one did. web.js fills both. The error
// is here, under the last line printed, rather than at the foot of the
// frame as on a page of one's own, so that it reads as the next line.
const DEFAULT_PAGE = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 14px 16px; background: #fff; color: #141a2e;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  #zeno-error { margin-top: 8px; padding: 10px 12px; border-left: 3px solid #c62828;
                background: #fdecec; color: #8e1b1b; }
  #zeno-error:empty { display: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #ececec; }
    #zeno-error { background: #2a1414; color: #ff9c9c; border-color: #ff6b6b; }
  }
</style>
</head>
<body>
<pre id="zeno-output"></pre>
<pre id="zeno-error"></pre>
</body>
</html>
`;

const program = document.getElementById("program");
const page = document.getElementById("page");
const result = document.getElementById("result");
const said = document.getElementById("said");
const examples = document.getElementById("examples");

// web.js is run here too, only for `Zeno.unpacked`: the frame of each
// run gets a copy of its own.
new Function(WEB_JS)();

// Zeno is unpacked and read in once. Each run starts it afresh from
// this, which is quick. The frames find it here, as `parent.zenoModule`.
window.zenoModule = Zeno.unpacked(PACKED).then((bytes) => WebAssembly.compile(bytes));

// `<` written this way is the same text to JSON and nothing to the
// browser, which would read the closing tag of a script, written in a
// program, as the end of ours.
function quoted(value) {
  return JSON.stringify(value).replace(/</g, "\\u003c");
}

function run() {
  const files = { main: "main.zeno", files: { "main.zeno": program.value } };
  const own = page.value.trim() === "" ? DEFAULT_PAGE : page.value;
  const scripts =
    "<script>\n" + WEB_JS + "<\/script>\n" +
    "<script>Zeno.start(parent.zenoModule, " + quoted(files) + ");<\/script>\n";
  const at = own.toLowerCase().lastIndexOf("</body>");
  result.srcdoc = at < 0 ? own + scripts : own.slice(0, at) + scripts + own.slice(at);
  said.textContent = "Ran at " + new Date().toLocaleTimeString();
  // The address now says what was run, so that it can be sent on.
  history.replaceState(null, "", "#" + packed({ program: program.value, page: page.value }));
}

// A program in the address of the page: JSON, in base64 that an address
// can hold.
function packed(what) {
  const bytes = new TextEncoder().encode(JSON.stringify(what));
  let text = "";
  bytes.forEach((byte) => { text += String.fromCharCode(byte); });
  return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function unpackedAddress() {
  try {
    const text = atob(location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/"));
    const what = JSON.parse(new TextDecoder().decode(Uint8Array.from(text, (c) => c.charCodeAt(0))));
    return typeof what.program === "string" ? what : null;
  } catch (unreadable) {
    return null;
  }
}

function show(example) {
  program.value = example.program;
  page.value = example.page || "";
}

EXAMPLES.forEach((example, place) => {
  const option = document.createElement("option");
  option.value = place;
  option.textContent = example.name;
  examples.appendChild(option);
});
examples.addEventListener("change", () => {
  show(EXAMPLES[examples.value]);
  run();
});

// The two things to write: the program, and the page it is in.
function choose(tab) {
  for (const [name, box] of [["program", program], ["page", page]]) {
    box.hidden = name !== tab;
    document.getElementById("tab-" + name).setAttribute("aria-selected", String(name === tab));
  }
  (tab === "program" ? program : page).focus();
}
document.getElementById("tab-program").addEventListener("click", () => choose("program"));
document.getElementById("tab-page").addEventListener("click", () => choose("page"));

document.getElementById("run").addEventListener("click", run);
document.getElementById("link").addEventListener("click", () => {
  run();
  const done = () => { said.textContent = "Link copied"; };
  if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, () => { said.textContent = "The link is in the address bar"; });
  else said.textContent = "The link is in the address bar";
});

for (const box of [program, page]) {
  box.addEventListener("keydown", (pressed) => {
    // Ctrl+Enter (Cmd+Enter on a Mac) runs.
    if (pressed.key === "Enter" && (pressed.ctrlKey || pressed.metaKey)) {
      pressed.preventDefault();
      run();
    }
    // Tab indents by four spaces, as `zeno format` does, and does not
    // leave the box.
    if (pressed.key === "Tab" && !pressed.shiftKey && !pressed.ctrlKey && !pressed.altKey) {
      pressed.preventDefault();
      box.setRangeText("    ", box.selectionStart, box.selectionEnd, "end");
    }
  });
}

show(unpackedAddress() || EXAMPLES[0]);
run();
</script>
</body>
</html>
