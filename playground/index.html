const EXAMPLES = [{"group":"Start here","name":"Hello","about":"The whole program is one line","program":"# The whole program. No main(), no imports, no semicolons.\nprint(\"Hello, Zeno!\")\n","page":""},{"group":"Start here","name":"A tour of the language","about":"Most of Zeno on one page","program":"# tour.zeno: a sketch of what Zeno might look like. Nothing here is final.\n#\n# Two rules:\n#   1. Words over symbols. Keywords are whole words you can read aloud.\n#   2. Punctuation has to earn its place. Braces mark blocks, and that's\n#      about it: no semicolons, no colons after if/for, no brackets around conditions.\n\nfrom math import sqrt\n\n# --- Variables: say once whether a value can change ---\n\nlet name = \"Zeno\"                      # let: set once, never changes\nvar count = 3                          # var: can change later\ncount = count + 1                      # plain = updates an existing variable\nlet ports: list[int] = [80, 443, 8080]  # write the type only when you want to\n\nconst PI = 3.14159                     # const: fixed when the program is built\n\n# --- Functions ---\n\nfunction greet(who: str, excited: bool = false) -> str {\n    if excited {\n        return f\"Hello, {who}!\"\n    }\n    return f\"Hello, {who}.\"\n}\n\n# --- Classes: fields at the top, methods below ---\n\nclass Point {\n    x: float\n    y: float\n\n    function distance_to(self, other: Point) -> float {\n        return sqrt((self.x - other.x) ** 2 + (self.y - other.y) ** 2)\n    }\n}\n\nlet origin = Point(0.0, 0.0)\nlet here = Point(x=3.0, y=4.0)\n\n# --- Enums that carry data, and match to take them apart ---\n\nenum Shape {\n    Circle(radius: float)\n    Rect(width: float, height: float)\n}\n\nfunction area(shape: Shape) -> float {\n    match shape {\n        case Circle(r) { return PI * r * r }\n        case Rect(w, h) { return w * h }\n    }\n    # Forget a case and the compiler tells you, before the program ever runs.\n}\n\n# --- Errors: try / except / raise, but checked ---\n\nfunction parse_port(text: str) -> int raises ValueError {\n    let port = int(text)               # int() may raise ValueError; it passes up\n    if not 1 \u003c= port \u003c= 65535 {        # comparisons chain, as in maths\n        raise ValueError(\"port out of range\")\n    }\n    return port\n}\n\ntry {\n    let port = parse_port(\"8080\")\n    print(f\"listening on {port}\")\n} except ValueError as err {\n    print(f\"error: {err}\")\n}\n# Under the hood a `try` remembers one place to jump back to. There are no\n# unwinding tables as in C++, so it is cheap enough for a microcontroller.\n\n# --- No surprise none ---\n\nfunction find_user(id: int) -> str or none {\n    if id == 1 {\n        return \"partha\"\n    }\n    return none\n}\n\nlet user = find_user(2)\nif user is not none {\n    print(user.upper())                # allowed only inside this check\n}\n\n# --- Loops ---\n\nfor shape in [Circle(1.0), Rect(2.0, 3.0)] {\n    print(f\"area = {area(shape):.2f}\")\n}\n\nvar tries = 0\nwhile tries \u003c 3 and ports[tries] != 8080 {\n    tries += 1\n}\n\nlet squares = [n * n for n in range(10) if n % 2 == 0]\nprint(greet(name, excited=true), count, squares, origin.distance_to(here))\n\n# --- Functions are values, and units are types ---\n\nfunction twice(f: function(int) -> int, x: int) -> int {\n    return f(f(x))\n}\n\nfunction describe(delay: ms) -> str {    # only a quantity in ms is accepted\n    return f\"waiting {delay}\"\n}\n\nprint(twice(function(n) { return n * 3 }, 2), describe(500 ms))\n","page":""},{"group":"Start here","name":"Primes","about":"Loops, lists and numbers","program":"# primes.zeno: a program small enough for `zeno build` to compile today.\n#\n#     zeno run examples/primes.zeno      run it with the interpreter\n#     zeno build examples/primes.zeno    compile it to primes.c and ./primes\n#     zeno build --llvm examples/primes.zeno    the same through LLVM IR (primes.ll)\n#\n# All three must print exactly the same thing. No types are written anywhere:\n# the checker works them out, and the C that comes out is fully typed.\n\nfunction is_prime(n) {\n    if n \u003c 2 {\n        return false\n    }\n    var d = 2\n    while d * d \u003c= n {\n        if n % d == 0 {\n            return false\n        }\n        d += 1\n    }\n    return true\n}\n\nfunction count_primes(limit) {\n    var count = 0\n    for n in range(limit) {\n        if is_prime(n) {\n            count += 1\n        }\n    }\n    return count\n}\n\nfunction average_gap(limit) {\n    return limit / count_primes(limit)\n}\n\nlet limit = 10000\nprint(f\"primes below {limit}: {count_primes(limit)}\")\nprint(f\"one in every {average_gap(limit):.2f} numbers\")\n\nvar largest = limit\nwhile not is_prime(largest) {\n    largest -= 1\n}\nprint(f\"the largest is {largest}, or {largest:x} in hex\")\n","page":""},{"group":"Start here","name":"Four ways to write it","about":"One job, typed, untyped, with a class, functional","program":"# styles.zeno: one small job, written four ways.\n#\n# The job: a temperature sensor gives some readings. Throw away the ones\n# that are out of range, and average the rest.\n#\n# Zeno does not make you pick a style. Types are optional, and you can\n# organise code around objects, around functions, or mix the two.\n\nlet readings = [21.5, 22.0, -99.0, 21.0, 150.0]\n\n# --- 1. With types, around a class (object-oriented) ---\n#\n# The data and the code that works on it live together. The types say what\n# each thing is, and will be checked before the program runs.\n\nclass Sensor {\n    low: float\n    high: float\n    readings: list[float]\n\n    function is_valid(self, reading: float) -> bool {\n        return self.low \u003c= reading \u003c= self.high\n    }\n\n    function average(self) -> float {\n        var total: float = 0.0\n        var count: int = 0\n        for reading in self.readings {\n            if self.is_valid(reading) {\n                total += reading\n                count += 1\n            }\n        }\n        return total / count\n    }\n}\n\nlet sensor = Sensor(low=-40.0, high=85.0, readings=readings)\nprint(\"typed, with a class:  \", sensor.average())\n\n# --- 2. The same thing with no types ---\n#\n# Exactly the same program with every type left out. It runs the same.\n# You can start like this and add types later, a line at a time.\n\nclass LooseSensor {\n    low\n    high\n    readings\n\n    function is_valid(self, reading) {\n        return self.low \u003c= reading \u003c= self.high\n    }\n\n    function average(self) {\n        var total = 0.0\n        var count = 0\n        for reading in self.readings {\n            if self.is_valid(reading) {\n                total += reading\n                count += 1\n            }\n        }\n        return total / count\n    }\n}\n\nlet loose = LooseSensor(-40.0, 85.0, readings)\nprint(\"untyped, with a class:\", loose.average())\n\n# --- 3. Around functions (functional) ---\n#\n# No object and no variable that changes. Small functions are passed to\n# other functions: filter keeps some items, reduce folds a list into one value.\n\nfunction in_range(low: float, high: float) {\n    # Returns a new function that remembers low and high.\n    return function(reading: float) -> bool {\n        return low \u003c= reading \u003c= high\n    }\n}\n\nfunction add(total: float, reading: float) -> float {\n    return total + reading\n}\n\nlet valid = readings.filter(in_range(-40.0, 85.0))\nprint(\"functional:           \", valid.reduce(add, 0.0) / len(valid))\n\n# --- 4. The short way ---\n#\n# A comprehension and a built-in do the same job in two lines.\n\nlet kept = [r for r in readings if -40.0 \u003c= r \u003c= 85.0]\nprint(\"comprehension:        \", sum(kept) / len(kept))\n","page":""},{"group":"The language","name":"Shapes","about":"Classes, enums and match","program":"# shapes.zeno: classes, enums, lists and match, in a program that\n# `zeno build` can compile.\n#\n#     zeno run examples/shapes.zeno      run it with the interpreter\n#     zeno build examples/shapes.zeno    compile it to shapes.c and ./shapes\n#     zeno build --llvm examples/shapes.zeno    the same through LLVM IR (shapes.ll)\n#\n# Open shapes.c afterwards: a class is a C struct, an enum is a struct with\n# a tag and a union, and `match` is an if / else if chain on the tag.\n\nimport math\n\nclass Point {\n    x: float\n    y: float\n\n    function distance_to(self, other: Point) -> float {\n        return math.sqrt((self.x - other.x) ** 2 + (self.y - other.y) ** 2)\n    }\n}\n\nenum Shape {\n    Circle(centre: Point, radius: float)\n    Rect(corner: Point, width: float, height: float)\n    Nothing\n}\n\nfunction area(shape) {\n    match shape {\n        case Circle(_, r) { return math.pi * r * r }\n        case Rect(_, w, h) { return w * h }\n        case Nothing { return 0.0 }\n    }\n}\n\nlet origin = Point(0.0, 0.0)\nlet shapes = [Circle(origin, 1.0), Rect(Point(1.0, 1.0), 2.0, 3.0), Nothing]\n\nvar total = 0.0\nfor shape in shapes {\n    print(f\"{shape} has area {area(shape):.2f}\")\n    total += area(shape)\n}\nprint(f\"total {total:.2f}, biggest first: {[area(s) for s in shapes if area(s) > 4.0]}\")\nprint(origin.distance_to(Point(3.0, 4.0)), shapes[2] == Nothing, len(shapes))\n","page":""},{"group":"The language","name":"Generics","about":"One ring buffer for many types","program":"# generics.zeno: one piece of code for many types.\n#\n# A ring buffer keeps the newest few things it was given and forgets the\n# oldest. Firmware is full of them: bytes from a serial port, readings\n# from a sensor, events waiting their turn. The code is the same whatever\n# is kept, so it is written once, with `T` standing for \"whatever this\n# ring holds\".\n#\n#     zeno run examples/generics.zeno            run it with the interpreter\n#     zeno build examples/generics.zeno          compile it to C\n#     zeno build --llvm examples/generics.zeno   compile it through LLVM\n\n# --- A generic class ---\n\n# `Ring[T]` is not one class. It is a pattern for as many as the program\n# uses: `Ring[u8]` for bytes, `Ring[V]` for voltages, `Ring[str]` for text.\nclass Ring[T] {\n    slots: list[T]       # one place for each item the ring can hold\n    next: int = 0        # the place the next item goes to\n    count: int = 0       # how many items are in it\n    dropped: int = 0     # how many old items were written over\n\n    function push(self, item: T) {\n        if self.count == len(self.slots) {\n            self.dropped += 1            # full: the oldest is written over\n        } else {\n            self.count += 1\n        }\n        self.slots[self.next] = item\n        self.next = (self.next + 1) % len(self.slots)\n    }\n\n    # What is in the ring, oldest first.\n    function items(self) -> list[T] {\n        let size = len(self.slots)\n        let oldest = (self.next + size - self.count) % size\n        var out: list[T] = []\n        for i in range(self.count) {\n            out.append(self.slots[(oldest + i) % size])\n        }\n        return out\n    }\n\n    # The item pushed last, or `none` while the ring is empty.\n    function newest(self) -> T or none {\n        if self.count == 0 {\n            return none\n        }\n        let size = len(self.slots)\n        return self.slots[(self.next + size - 1) % size]\n    }\n}\n\n# --- Generic functions ---\n\n# A ring with room for `size` items. Every place holds `empty` until\n# something is pushed. `T` is whatever `empty` is.\nfunction ring[T](size: int, empty: T) -> Ring[T] {\n    var slots: list[T] = []\n    for i in range(size) {\n        slots.append(empty)\n    }\n    return Ring(slots)\n}\n\n# The biggest item of a list that has at least one. It works for every\n# type that `>` works for: numbers, text, quantities.\nfunction largest[T](items: list[T]) -> T {\n    var best = items[0]\n    for item in items {\n        if item > best {\n            best = item\n        }\n    }\n    return best\n}\n\n# How many items pass a test.\nfunction count_where[T](items: list[T], test: function(T) -> bool) -> int {\n    var count = 0\n    for item in items {\n        if test(item) {\n            count += 1\n        }\n    }\n    return count\n}\n\n# Two type parameters: a list of one type becomes a list of another.\nfunction convert[T, U](items: list[T], change: function(T) -> U) -> list[U] {\n    var out: list[U] = []\n    for item in items {\n        out.append(change(item))\n    }\n    return out\n}\n\n# --- Bytes from a serial port ---\n\n# `u8(0)` makes this a Ring[u8]: every place in it is one byte.\nlet bytes = ring(4, u8(0))\nfor byte in [0x48, 0x65, 0x6C, 0x6C, 0x6F, 0x21] {\n    bytes.push(u8(byte))\n}\nprint(\"bytes:\", bytes.items(), \"newest\", bytes.newest(), \"dropped\", bytes.dropped)\nprint(\"above 0x60:\", count_where(bytes.items(), function(b: u8) -> bool { return b > 0x60 }))\nprint(\"as hex:\", convert(bytes.items(), function(b: u8) -> str { return f\"{b:02x}\" }))\n\n# --- Voltages from a sensor ---\n\n# The same class, as a Ring[V]. A reading in amps would not go in.\nlet volts = ring(3, 0.0 V)\nprint(\"no reading yet:\", volts.newest())\nfor reading in [3.1 V, 3.3 V, 2.9 V, 3.2 V] {\n    volts.push(reading)\n}\nprint(\"volts:\", volts.items(), \"highest\", largest(volts.items()))\nprint(\"low:\", count_where(volts.items(), function(v: V) -> bool { return v \u003c 3.0 V }))\n\n# --- Text ---\n\n# The type can be written out where that reads better.\nlet log: Ring[str] = ring(2, \"\")\nlog.push(\"boot\")\nlog.push(\"sensor ready\")\nlog.push(\"first reading\")\nprint(\"log:\", log.items(), \"last in the alphabet:\", largest(log.items()))\nprint(\"lengths:\", convert(log.items(), function(line: str) -> int { return len(line) }))\nprint(log)\n","page":""},{"group":"The language","name":"Counting faults","about":"A dict of counts, sorted","program":"# A dict keeps one value under each key. Here a device has been sending\n# fault codes, and the program counts how often each one came and looks\n# up what it means.\n#\n#     zeno run examples/faults.zeno\n\n# What each code means. The keys are ints and the values are text, so\n# this is a `dict[int, str]`.\nlet meanings = [\n    17: \"over voltage\",\n    23: \"over temperature\",\n    40: \"fan stalled\",\n    51: \"lost communication\",\n]\n\n# The codes, in the order they arrived.\nlet arrived = [23, 17, 23, 40, 23, 99, 17, 23]\n\n# How often each code came. It starts empty, and `[:]` alone does not\n# say what will be put in, so the type is written beside the name.\nlet seen: dict[int, int] = [:]\nfor code in arrived {\n    # `get` with a second argument gives that when the key is not there.\n    seen[code] = seen.get(code, 0) + 1\n}\n\n# A loop with two names is given each key and what is under it, in the\n# order the keys were put in.\nfor code, count in seen {\n    let meaning = meanings.get(code, \"a code nobody wrote down\")\n    print(f\"{code}: {meaning} (x{count})\")\n}\n\n# Which one came most often? A loop with one name is given the keys.\nvar worst = arrived[0]\nfor code in seen {\n    if seen[code] > seen[worst] {\n        worst = code\n    }\n}\nprint(\"most often:\", meanings[worst])\n\n# `in` asks whether a key is there.\nprint(40 in seen, 51 in seen)\n\n# `get` with one argument gives `none` when the key is not there, so the\n# answer is checked before it is used.\nlet fan = seen.get(40)\nif fan is not none {\n    print(\"the fan stalled\", fan, \"time\")\n}\n\n# `pop` takes a key out and gives its value.\nlet unknown = seen.pop(99)\nprint(\"left out\", unknown, \"reading with an unknown code\")\nprint(seen)\n\n# Text keys: the settings of the device, by name. Storing under a key\n# that is there replaces its value. Storing under a new key adds it.\nlet settings = [\"mode\": \"auto\", \"unit\": \"celsius\"]\nsettings[\"mode\"] = \"manual\"\nsettings[\"limit\"] = \"85\"\nprint(settings)\nprint(settings.keys())\nprint(settings.values())\nprint(len(settings))\n","page":""},{"group":"The language","name":"Handlers","about":"Functions as values, and errors","program":"# Handlers and faults: function values and errors that are kept.\n#\n#   zeno run examples/handlers.zeno\n#   zeno build --no-collector examples/handlers.zeno && ./handlers\n#\n# A raw sensor reading goes through a chain of steps. Each step is a\n# function value, kept in a list. A reading that ends up too high raises\n# an error, and the error is kept in a log instead of being thrown away.\n#\n# Built with `--no-collector`, every function value and every error here\n# has one owner, which frees it. docs/functions-and-errors.md walks\n# through how.\n\nclass OutOfRange {\n    channel: str\n    value: int\n}\n\nclass Channel {\n    name: str\n    limit: int\n    steps: list[function(int) -> int]\n\n    # `take`: the list owns the function from here on.\n    function add(self, step: take function(int) -> int) {\n        self.steps.append(step)\n    }\n\n    function process(self, raw: int) -> int raises OutOfRange {\n        var value = raw\n        for step in self.steps {\n            value = step(value)\n        }\n        if value > self.limit {\n            raise OutOfRange(self.name, value)\n        }\n        return value\n    }\n}\n\n# A function that makes a function. `factor` is copied into it.\nfunction scale_by(factor: int) -> function(int) -> int {\n    return function(n: int) -> int { return n * factor }\n}\n\nfunction offset_by(amount: int) -> function(int) -> int {\n    return function(n: int) -> int { return n + amount }\n}\n\n# A function of the program is a value too. It is never freed.\nfunction not_below_zero(n: int) -> int {\n    if n \u003c 0 { return 0 }\n    return n\n}\n\nfunction describe(fault: OutOfRange) -> str {\n    return f\"{fault.channel} read {fault.value}\"\n}\n\n# Catches the error, says so, and raises the same error again.\nfunction checked(channel: Channel, raw: int) -> int raises OutOfRange {\n    try {\n        return channel.process(raw)\n    } except OutOfRange as fault {\n        print(\"  passing on:\", describe(fault))\n        raise fault\n    }\n}\n\nlet temperature = Channel(\"temp\", 120, [])\ntemperature.add(offset_by(-40))\ntemperature.add(not_below_zero)\ntemperature.add(scale_by(2))\n\nlet faults: list[OutOfRange] = []\nfor raw in [35, 60, 120, 70, 130] {\n    try {\n        print(raw, \"->\", checked(temperature, raw))\n    } except OutOfRange as fault {\n        faults.append(fault)              # kept: the list owns the error now\n    }\n}\nprint(len(faults), \"faults kept\")\nfor fault in faults {\n    print(\"  \", describe(fault))\n}\n\n# A variable can hold one function and then another. The old one is freed.\nvar alarm: function(int) -> int = not_below_zero\nprint(alarm(-5))\nalarm = offset_by(1000)\nprint(alarm(-5))\n\n# A function that uses a list or an object from outside it only looks at\n# it, so it lives for the line that writes it and no longer.\nlet over = [90, 130, 150].filter(function(n: int) -> bool { return n > temperature.limit })\nprint(over, [1, 2].map(function(n: int) -> int { return n + len(faults) }))\n\n# An error is a value like any other: made here, raised later.\nfunction open(door: int, problem: take ValueError) -> int raises ValueError {\n    if door > 3 {\n        raise problem\n    }\n    return door\n}\ntry {\n    print(open(2, ValueError(\"not raised\")))\n    print(open(7, ValueError(\"no such door\")))\n} except ValueError as problem {\n    print(\"refused:\", problem.message)\n}\n","page":""},{"group":"The language","name":"Commands","about":"Enum cases that carry values","program":"# Commands from a serial console, and a small machine that runs them.\n#\n# An enum whose cases carry values, and values that may be `none`, in a\n# build with no garbage collector:\n#\n#     zeno run examples/commands.zeno\n#     zeno build --no-collector --memory examples/commands.zeno && ./commands\n#\n# A `Command` that carries something is kept in a block of its own, like\n# an object, and has one owner, which frees it. docs/enums-and-none.md is\n# the walkthrough.\n\nenum Command {\n    Stop                          # carries nothing: one fixed value\n    Wait(ms: int)\n    Set(pin: int, on: bool)\n    Say(text: str)                # the command has its own copy of the text\n    Blink(pins: list[int])        # and owns this list\n}\n\n# What the machine is doing. No case carries anything, so each `Mode` is\n# one fixed value, and is copied like a number.\nenum Mode {\n    Idle\n    Busy\n    Halted\n}\n\n# One line of text is a command, or is not: `none` says so, and the\n# caller cannot forget to ask.\nfunction parse(line: str) -> Command or none {\n    let words = line.split()\n    if len(words) == 0 {\n        return none\n    }\n    try {\n        match words[0] {\n            case \"stop\" { return Stop }\n            case \"wait\" {\n                if len(words) == 2 { return Wait(int(words[1])) }\n            }\n            case \"set\" {\n                if len(words) == 3 { return Set(int(words[1]), words[2] == \"on\") }\n            }\n            case \"say\" { return Say(line) }\n            case \"blink\" { return Blink([int(word) for word in words if word != \"blink\"]) }\n            case _ { }\n        }\n    } except ValueError as mistake {\n        print(\"  (\", mistake.message, \")\")\n    }\n    return none\n}\n\n# A parameter only looks at the command. `match` looks too: a number\n# or a text that a case carries is copied out, and `pins` is a look at\n# the list, which stays in the command.\nfunction cost(command: Command) -> int {\n    match command {\n        case Stop { return 0 }\n        case Wait(ms) { return ms }\n        case Set(_, _) { return 1 }\n        case Say(text) { return len(text) }\n        case Blink(pins) { return 100 * len(pins) }\n    }\n}\n\nclass Machine {\n    mode: Mode\n    clock: int\n    waiting: list[Command]        # the list owns each command in it\n    last: Command or none         # what ran last, when something has\n\n    # `take`: the machine takes the command, and its list keeps it.\n    function queue(self, command: take Command) {\n        self.waiting.append(command)\n    }\n\n    function busy_for(self) -> int {\n        var total = 0\n        for command in self.waiting {\n            total += cost(command)\n        }\n        return total\n    }\n}\n\n# Run one command. It is the caller's to give: `command` is freed when\n# this returns, unless it is given on.\nfunction run(machine: Machine, command: take Command) -> Mode {\n    machine.clock += cost(command)\n    match command {\n        case Stop { return Halted }\n        case Say(text) { print(f\"[{machine.clock}] says: {text}\") }\n        case other { print(f\"[{machine.clock}] {other}\") }\n    }\n    return Busy\n}\n\nlet machine = Machine(Idle, 0, [], none)\nfor line in [\"wait 9\", \"stop\", \"wait 250\", \"set 13 on\", \"jump 3\", \"say hello there\", \"blink 2 3 5\", \"wait soon\"] {\n    let command = parse(line)\n    if command is none {\n        print(\"not a command:\", line)\n    } else {\n        machine.queue(command)    # `command` holds nothing after this line\n    }\n}\nprint(len(machine.waiting), \"commands, busy for\", machine.busy_for())\n\n# Take the commands out last first, and run each until one halts.\nwhile machine.mode != Halted and len(machine.waiting) > 0 {\n    let next = machine.waiting.pop()\n    machine.mode = run(machine, next)\n}\nprint(machine.mode, \"with\", len(machine.waiting), \"left\")\n\n# A new value takes the place of the old one, which is freed on the spot.\nmachine.last = parse(\"say goodbye\")\nmachine.last = parse(\"set 4 off\")\nmatch machine.last {\n    case none { print(\"nothing ran last\") }\n    case Set(pin, on) { print(\"last: pin\", pin, \"on:\", on) }\n    case _ { print(\"last: something else\") }\n}\nprint(machine)\n","page":""},{"group":"Firmware","name":"Packets","about":"Sized numbers and bit operators","program":"# packet.zeno: sized whole numbers and bit operators.\n#\n# A sensor sends each reading as six bytes:\n#\n#     byte 0      0xA5, which marks the start of a frame\n#     byte 1      flags in the top four bits, the sensor's number in the low four\n#     byte 2, 3   the reading, high byte first\n#     byte 4      how many readings have been sent, starting again after 255\n#     byte 5      the sum of bytes 0 to 4, cut down to a byte\n#\n# This program packs readings into frames and unpacks them again.\n#\n# Run it with:  zeno run examples/packet.zeno\n\nconst START: u8 = 0xA5\nconst ALARM: u8 = 0b1000\nconst BATTERY_LOW: u8 = 0b0100\n\n# As plain ints these four fields would take thirty-two bytes of an\n# object. With sizes they take six.\nclass Reading {\n    sensor: u8\n    flags: u8\n    value: u16\n    count: u8\n}\n\nfunction checksum(bytes: list[u8]) -> u8 {\n    # Sums are done on ints, so `total` cannot overflow at 255.\n    var total = 0\n    for byte in bytes {\n        total += byte\n    }\n    # Only the low eight bits are sent. `wrap` says so out loud.\n    return u8.wrap(total)\n}\n\nfunction encode(reading: Reading) -> list[u8] {\n    # Each `u8( )` checks that what it is given fits. Flags above 15\n    # would not: shifted up by four they need more than a byte.\n    let frame: list[u8] = [\n        START,\n        u8(reading.flags \u003c\u003c 4 | reading.sensor),\n        u8(reading.value >> 8),\n        u8(reading.value & 0xFF),\n        reading.count\n    ]\n    frame.append(checksum(frame))\n    return frame\n}\n\nfunction decode(frame: list[u8]) -> Reading raises ValueError {\n    if len(frame) != 6 or frame[0] != START {\n        raise ValueError(\"this is not a frame\")\n    }\n    let body = [frame[i] for i in range(5)]\n    if checksum(body) != frame[5] {\n        raise ValueError(f\"the checksum should be {checksum(body):02x}, but the frame says {frame[5]:02x}\")\n    }\n    return Reading(\n        sensor=u8(frame[1] & 0x0F),\n        flags=u8(frame[1] >> 4),\n        value=u16(frame[2] \u003c\u003c 8 | frame[3]),\n        count=frame[4]\n    )\n}\n\nfunction hex(bytes: list[u8]) -> str {\n    var text = \"\"\n    for byte in bytes {\n        text += f\"{byte:02x} \"\n    }\n    return text.strip()\n}\n\n# The counter starts near the top to show it going round.\nvar count: u8 = 254\nfor value in [215, 1023, 64000] {\n    var flags: u8 = 0\n    if value > 1000 {\n        flags = ALARM\n    }\n    if value > 60000 {\n        # `|` gives an int, like every operator, and `|=` checks that it\n        # fits as it is stored: this is `flags = u8(flags | BATTERY_LOW)`.\n        flags |= BATTERY_LOW\n    }\n    let reading = Reading(sensor=3, flags=flags, value=u16(value), count=count)\n    let frame = encode(reading)\n    let back = decode(frame)\n    print(hex(frame), \" \", back, back == reading)\n    if back.flags & ALARM != 0 {\n        print(\"  alarm on sensor\", back.sensor)\n    }\n    # 254, 255, 0: the same way the counter in the sensor goes round.\n    count = u8.wrap(count + 1)\n}\n\n# One byte changed on the way, and the checksum no longer agrees.\nlet damaged = encode(Reading(sensor=1, flags=0, value=500, count=0))\ndamaged[3] = 0xFF\ntry {\n    print(decode(damaged))\n} except ValueError as e {\n    print(e.message)\n}\n","page":""},{"group":"Firmware","name":"Sensor sentences","about":"Reading GPS-style lines and checksums","program":"# Lines from a sensor, in the style of a GPS receiver:\n#\n#     $TEMP,21.5,19.0,22.25*07\n#\n# A `$`, a name, some readings with commas between, a `*`, and a checksum\n# in hex: every character between the `$` and the `*`, XORed together.\n#\n# This uses the methods text and lists have (docs/library.md), and\n# builds every way, with no collector too:\n#\n#     zeno run examples/sentence.zeno\n#     zeno build --no-collector --memory examples/sentence.zeno && ./sentence\n\n# `code()` is the number of one character: 65 for \"A\".\nfunction checksum(body: str) -> int {\n    var sum_ = 0\n    for ch in body {\n        sum_ = sum_ ^ ch.code()\n    }\n    return sum_\n}\n\n# The part between `$` and `*`. `find` answers with a position, or with\n# `none` when there is no `*`, and the answer cannot be used as a number\n# until that has been asked.\nfunction body_of(line: str) -> str or none {\n    let star = line.find(\"*\")\n    if star is none or not line.starts_with(\"$\") {\n        return none\n    }\n    return line.slice(1, star)\n}\n\n# The two hex digits after the `*`, as a number.\nfunction sent_sum(line: str) -> int or none {\n    let star = line.find(\"*\")\n    if star is none or len(line) != star + 3 {\n        return none\n    }\n    let digits = \"0123456789ABCDEF\"\n    let high = digits.find(line.slice(star + 1, star + 2))\n    let low = digits.find(line.slice(star + 2))\n    if high is none or low is none {\n        return none\n    }\n    return high * 16 + low\n}\n\n# The middle reading. The caller's list is left as it was: `slice(0)` is\n# a copy of all of it, and the copy is what gets sorted.\nfunction median(values: list[float]) -> float {\n    let sorted = values.slice(0)\n    sorted.sort()\n    return sorted[len(sorted) // 2]\n}\n\nfunction report(line: str) -> str {\n    let body = body_of(line)\n    let sent = sent_sum(line)\n    if body is none or sent is none {\n        return \"not a sentence\"\n    }\n    if checksum(body) != sent {\n        return f\"bad checksum: {checksum(body):02X}, not {sent:02X}\"\n    }\n    let fields = body.split(\",\")\n    let name = fields.pop(0)\n    var readings: list[float] = []\n    for field in fields {\n        try {\n            readings.append(float(field))\n        } except ValueError {\n            return f\"{name}: `{field}` is not a number\"\n        }\n    }\n    if len(readings) == 0 {\n        return f\"{name}: no readings\"\n    }\n    fields.insert(0, f\"median {median(readings)} of\")\n    return f\"{name}: \" + fields.join(\" \")\n}\n\n# Makes a sentence, to try the other direction: `char` is `code` backwards.\nfunction sentence(name: str, readings: list[float]) -> str {\n    var fields = [name]\n    for reading in readings {\n        fields.append(str(reading))\n    }\n    let body = fields.join(\",\")\n    return f\"${body}*{checksum(body):02X}\"\n}\n\nlet lines = [\n    sentence(\"TEMP\", [21.5, 19.0, 22.25]),\n    \"$VOLT,3.3,3.1,3.4,3.2,3.3*07\",\n    \"$VOLT,3.3,3.1*00\",\n    \"$VOLT,3.3,high*21\",\n    \"$FLOW*12\",\n    \"hello\",\n]\nfor line in lines {\n    print(line)\n    print(\"  \", report(line))\n}\n\n# The names of what arrived, in order, and without the ones that failed.\nvar names: list[str] = []\nfor line in lines {\n    let body = body_of(line)\n    if body is not none {\n        let comma = body.find(\",\")\n        if comma is not none and body.slice(0, comma) not in names {\n            names.append(body.slice(0, comma))\n        }\n    }\n}\nnames.sort()\nnames.reverse()\nprint(names.join(\" > \"))\nprint(char(90) + char(101) + char(110) + char(111))\n","page":""},{"group":"Firmware","name":"A scheduler","about":"Tasks that run every so many ticks","program":"# A small scheduler: tasks that run every so many ticks.\n#\n# There is not one `owned` in this file, and it still builds with no\n# garbage collector:\n#\n#     zeno run examples/scheduler.zeno\n#     zeno build --no-collector --memory examples/scheduler.zeno && ./scheduler\n#\n# In that build every list and every object has one owner: whoever\n# received it. docs/one-owner.md is the walkthrough.\n\nclass Task {\n    name: str\n    every: int            # how many ticks lie between two runs\n    runs: list[int]       # the ticks it ran at. The task owns this list.\n\n    function due(self, tick: int) -> bool {\n        return tick % self.every == 0\n    }\n}\n\nclass Scheduler {\n    tasks: list[Task]     # the scheduler owns the list, and the list owns each task\n\n    function add(self, task: take Task) {\n        self.tasks.append(task)         # the task is the list's from here\n    }\n\n    # Run what is due at `now`. Returns how many tasks ran.\n    function tick(self, now: int) -> int {\n        var ran = 0\n        for task in self.tasks {        # the loop is lent each task in turn\n            if task.due(now) {\n                task.runs.append(now)\n                ran += 1\n            }\n        }\n        return ran\n    }\n}\n\n# These two only look, as every parameter does unless it says otherwise.\n# The caller goes on owning what it passes.\nfunction busiest(tasks: list[Task]) -> str {\n    var best = \"nothing\"\n    var most = 0\n    for task in tasks {\n        if len(task.runs) > most {\n            most = len(task.runs)\n            best = task.name\n        }\n    }\n    return best\n}\n\nfunction report(task: Task) -> str {\n    return f\"{task.name} ran {len(task.runs)} times: {task.runs}\"\n}\n\n# `take`: this one takes the task over, and frees it when it returns.\nfunction retire(task: take Task) -> int {\n    print(\"retiring\", task.name)\n    return len(task.runs)\n}\n\nlet scheduler = Scheduler([])\nscheduler.add(Task(\"blink\", 2, []))\nscheduler.add(Task(\"sample\", 3, []))\nlet slow = Task(\"log\", 5, [])\nscheduler.add(slow)                     # `slow` holds nothing after this line\n\nvar total = 0\nfor now in range(1, 11) {\n    total += scheduler.tick(now)\n}\nprint(\"runs:\", total)\nfor task in scheduler.tasks {\n    print(report(task))\n}\nprint(\"busiest:\", busiest(scheduler.tasks))\n\n# `[ ]` looks at a task where it is. The task can be changed there.\nscheduler.tasks[0].every = 4\nprint(scheduler.tasks[0].name, \"now runs every\", scheduler.tasks[0].every)\n\n# `pop()` takes a task out of the list. Whoever receives it owns it.\nlet last = scheduler.tasks.pop()\nprint(\"left:\", len(scheduler.tasks))\nprint(\"it ran\", retire(last), \"times\")\n\n# A new task takes the place of an old one, which is freed on the spot.\nscheduler.tasks[1] = Task(\"sample fast\", 1, [])\nprint(scheduler.tick(12), \"ran at tick 12\")\n\n# A list of lists. Each row belongs to the table.\nvar table = [[0, 0, 0], [0, 0, 0]]\ntable[1][2] = 7\ntable.append([1, 2, 3])\nfor row in table {\n    print(row)\n}\n","page":""},{"group":"Firmware","name":"Owned buffers","about":"Memory given back at a line you can point to","program":"# Owned values: memory that is given back at a line you can point to.\n#\n#     cargo run -- run examples/buffer.zeno\n#     cargo run -- build --memory examples/buffer.zeno && ./buffer\n#     cargo run -- build --no-collector --memory examples/buffer.zeno && ./buffer\n#\n# Most values in Zeno are shared, and a garbage collector frees them some\n# time after their last use (docs/memory.md). A value marked `owned` has\n# exactly one owner instead, and is freed the moment its owner's block\n# ends. docs/ownership.md explains the rules. This file is the short tour.\n#\n# Every list and object here is owned, so the third command above can\n# build the program with no collector in it at all (docs/no-collector.md).\n\n# Every Frame has one owner. When that owner's block ends, the frame and\n# the list inside it are freed, there and then.\nowned class Frame {\n    channel: int\n    samples: owned list[int]\n\n    # A method only looks at the object it is called on.\n    function peak(self) -> int {\n        var highest = 0\n        for sample in self.samples {\n            if sample > highest {\n                highest = sample\n            }\n        }\n        return highest\n    }\n}\n\n# An ordinary, shared class. An error to raise.\nclass Overload {\n    channel: int\n    peak: int\n}\n\n# Makes a frame and hands it to the caller, who owns it from then on.\nfunction capture(channel: int, size: int) -> Frame {\n    let samples: owned list[int] = [(n * n + channel * 13) % (400 + channel) for n in range(size)]\n    return Frame(channel, samples)    # `samples` moves into the frame\n}\n\n# A parameter looks at what it is given and cannot keep it. Any list\n# will do here, owned or shared, and the caller still has it afterwards.\nfunction average(samples: owned list[int]) -> int {\n    return sum(samples) // len(samples)\n}\n\n# `take`: `send` takes the frame over. The caller's variable is empty\n# after the call, and the frame is freed when `send` is done with it.\nfunction send(frame: take Frame) -> int raises Overload {\n    if frame.peak() > 480 {\n        raise Overload(frame.channel, frame.peak())\n    }\n    return len(frame.samples)\n}\n\nvar sent = 0\nvar quiet = 0\nvar refused: owned list[int] = []\n\nfor channel in range(120) {\n    let frame = capture(channel, 600)\n    if average(frame.samples) \u003c 205 {\n        quiet += 1\n        continue                      # `frame` is freed here,\n    }\n    try {\n        sent += send(frame)           # or it moves into `send`, which frees it.\n    } except Overload as overload {\n        refused.append(overload.channel)\n    }\n}\n\nprint(f\"sent {sent} samples, skipped {quiet} quiet frames\")\nprint(f\"refused {len(refused)} frames, the first on channel {refused[0]}\")\n\n# A `var` that owns its value can be given a new one. The old one is freed\n# at that line.\nvar window: owned list[int] = [0, 0, 0, 0]\nfor round in range(3) {\n    window = [value + round for value in window]\n}\nprint(window)\n\n# After a move the old name holds nothing, and the checker says so. Take\n# the `#` off the last line to see the message:\nlet last = capture(7, 4)\nprint(send(last))\n# print(last.channel)\n","page":""},{"group":"Pages","name":"Things to do","about":"A list you add to, in a page","program":"# A list of things to do, in a page.\n#\n# The page is `todo.html`, beside this file: a form with a box to type\n# in, an empty list, and a line that says how much is left. This program\n# is what the page does.\n#\n#     zeno build --web examples/todo.zeno    writes todo.web.html: open it\n#     zeno run examples/todo.zeno            runs it here, on a simulated page\n#     zeno test examples/todo.zeno           runs its tests\nimport web\n\nlet form = web.element(\"#add\")\nlet box = web.element(\"#what\")\nlet list = web.element(\"#list\")\nlet left = web.element(\"#left\")\n\n# How many things are not done yet.\nvar remaining = 0\n\nfunction show_remaining() {\n    if remaining == 1 {\n        left.text = \"1 thing left\"\n    } else {\n        left.text = f\"{remaining} things left\"\n    }\n}\n\n# Put one thing on the list. A click on it marks it done, and another\n# click takes that back.\nfunction add(what: str) {\n    let item = web.create(\"li\", what)\n    item.on(\"click\", function() {\n        if item.has_class(\"done\") {\n            item.remove_class(\"done\")\n            remaining += 1\n        } else {\n            item.add_class(\"done\")\n            remaining -= 1\n        }\n        show_remaining()\n    })\n    list.append(item)\n    remaining += 1\n    show_remaining()\n}\n\n# The form was sent: Enter in the box, or the Add button.\nfunction sent() {\n    let what = box.value.strip()\n    if what != \"\" {\n        add(what)\n        box.value = \"\"\n    }\n}\n\nform.on(\"submit\", sent)\n\n# Escape empties the box.\nweb.on_key(function(key: str) {\n    if key == \"Escape\" {\n        box.value = \"\"\n    }\n})\n\nadd(\"Read docs/web.md\")\nadd(\"Build this page\")\n\ntest \"a thing that is added is left to do\" {\n    let before = remaining\n    add(\"Water the plants\")\n    assert remaining == before + 1\n    assert left.text == f\"{remaining} things left\"\n}\n\ntest \"an empty box adds nothing\" {\n    let before = remaining\n    box.value = \"   \"\n    sent()\n    assert remaining == before\n}\n","page":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Things to do\u003c/title>\n\u003cstyle>\n  body { font: 18px/1.5 system-ui, sans-serif; max-width: 28em; margin: 3em auto; padding: 0 1em; }\n  form { display: flex; gap: 0.5em; }\n  input { flex: 1; font: inherit; padding: 0.3em 0.5em; }\n  button { font: inherit; padding: 0.3em 1em; }\n  ul { padding: 0; list-style: none; }\n  li { padding: 0.4em 0.2em; border-bottom: 1px solid #ddd; cursor: pointer; }\n  li.done { color: #999; text-decoration: line-through; }\n  #left { color: #666; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch1>Things to do\u003c/h1>\n\u003cform id=\"add\">\n  \u003cinput id=\"what\" placeholder=\"What is to be done?\" autofocus>\n  \u003cbutton>Add\u003c/button>\n\u003c/form>\n\u003cul id=\"list\">\u003c/ul>\n\u003cp id=\"left\">\u003c/p>\n\u003c/body>\n\u003c/html>\n"},{"group":"Pages","name":"Sketch","about":"Draw with the mouse or a finger","program":"# A sheet to draw on with the mouse, a finger or a pen, in a page.\n#\n# The page is `sketch.html`, beside this file: four buttons that are\n# colours, a button that wipes the sheet, and a `\u003ccanvas>`, which is an\n# element a program can draw on.\n#\n#     zeno build --web examples/sketch.zeno    writes sketch.web.html: open it\n#     zeno run examples/sketch.zeno            runs it here, on a simulated page\n#     zeno test examples/sketch.zeno           runs its tests\n#\n# It shows what `todo.zeno` does not: a function that asks for the\n# `Event` to learn where the mouse is, drawing, the style of one\n# element, and something that is kept from one visit to the next.\nimport web\n\nlet paper = web.element(\"#paper\")\nlet lines = web.element(\"#lines\")\n\n# The colour that is drawn in. The one chosen on the last visit, if\n# there was a visit.\nvar colour = \"black\"\nlet kept = web.load(\"sketch colour\")\nif kept is not none {\n    colour = kept\n}\n\n# Is the button of the mouse down, and where the mouse was last.\nvar drawing = false\nvar last_x = 0.0\nvar last_y = 0.0\nvar drawn = 0\n\nfunction show_drawn() {\n    lines.text = f\"{drawn} lines drawn\"\n    lines.set_style(\"color\", colour)\n}\n\n# Each colour button says which colour it is in the page itself, as\n# `data-colour`. The one that is chosen gets a black edge, which is a\n# class, and the look of the class is CSS.\nfunction choose(wanted: str) {\n    colour = wanted\n    web.save(\"sketch colour\", colour)\n    for button in web.elements(\".colour\") {\n        if button.get(\"data-colour\") == colour {\n            button.add_class(\"chosen\")\n        } else {\n            button.remove_class(\"chosen\")\n        }\n    }\n    show_drawn()\n}\n\nfor button in web.elements(\".colour\") {\n    let its = button.get(\"data-colour\")\n    if its is not none {\n        button.set_style(\"background-color\", its)\n        button.on(\"click\", function() { choose(its) })\n    }\n}\n\n# The mouse went down on the sheet: a line starts here.\nfunction pen_down(event: Event) {\n    drawing = true\n    last_x = event.x\n    last_y = event.y\n}\n\n# The mouse moved. With the button down, that is a line from where it\n# was to where it is.\nfunction pen_moved(event: Event) {\n    if drawing {\n        paper.draw_line(last_x, last_y, event.x, event.y, colour)\n        last_x = event.x\n        last_y = event.y\n        drawn += 1\n        show_drawn()\n    }\n}\n\nfunction pen_up() {\n    drawing = false\n}\n\nfunction wipe() {\n    paper.erase()\n    drawn = 0\n    show_drawn()\n    paper.draw_text(10, 10, \"Draw here\", \"silver\")\n}\n\n# \"pointer\" events come from a mouse, a finger and a pen alike, so the\n# same four lines draw on a desk and on a phone.\npaper.on(\"pointerdown\", pen_down)\npaper.on(\"pointermove\", pen_moved)\npaper.on(\"pointerup\", pen_up)\npaper.on(\"pointerleave\", pen_up)\nweb.element(\"#wipe\").on(\"click\", wipe)\n\nchoose(colour)\nwipe()\n\ntest \"the mouse draws only while its button is down\" {\n    let before = drawn\n    paper.fire(\"pointermove\")\n    assert drawn == before\n    paper.fire(\"pointerdown\")\n    paper.fire(\"pointermove\")\n    paper.fire(\"pointermove\")\n    assert drawn == before + 2\n    paper.fire(\"pointerup\")\n    paper.fire(\"pointermove\")\n    assert drawn == before + 2\n}\n\ntest \"a colour that is chosen is kept\" {\n    choose(\"crimson\")\n    assert web.load(\"sketch colour\") == \"crimson\"\n    assert lines.get_style(\"color\") == \"crimson\"\n}\n\ntest \"wiping starts the count again\" {\n    paper.fire(\"pointerdown\")\n    paper.fire(\"pointermove\")\n    web.element(\"#wipe\").fire(\"click\")\n    assert drawn == 0\n}\n","page":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Sketch\u003c/title>\n\u003cstyle>\n  body { font: 18px/1.5 system-ui, sans-serif; max-width: 30em; margin: 2em auto; padding: 0 1em; }\n  canvas { border: 1px solid #999; cursor: crosshair; font: 16px system-ui, sans-serif; touch-action: none;\n           max-width: 100%; height: auto; }\n  button { font: inherit; padding: 0.2em 0.8em; }\n  .colour { width: 2em; height: 2em; padding: 0; border: 3px solid white; outline: 1px solid #999; }\n  .colour.chosen { border-color: black; }\n  #lines { color: #666; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch1>Sketch\u003c/h1>\n\u003cp>\n  \u003cbutton class=\"colour\" data-colour=\"black\" title=\"black\">\u003c/button>\n  \u003cbutton class=\"colour\" data-colour=\"crimson\" title=\"red\">\u003c/button>\n  \u003cbutton class=\"colour\" data-colour=\"royalblue\" title=\"blue\">\u003c/button>\n  \u003cbutton class=\"colour\" data-colour=\"seagreen\" title=\"green\">\u003c/button>\n  \u003cbutton id=\"wipe\">Wipe\u003c/button>\n\u003c/p>\n\u003ccanvas id=\"paper\" width=\"480\" height=\"320\">\u003c/canvas>\n\u003cp id=\"lines\">\u003c/p>\n\u003c/body>\n\u003c/html>\n"}];         // [{group, name, about, program, page}]

const $ = (id) => document.getElementById(id);
const text = $("text"), colours = $("colours"), gutter = $("gutter");
const frame = $("frame"), said = $("said");
const mac = /Mac|iPhone|iPad/.test(navigator.platform);
if (mac) $("run-keys").textContent = "⌘ ↵";

// The page of a program that has none: what it prints, and under it,
// the error that stopped it, if one did. web.js fills both.
function outputPage() {
  const dark = getComputedStyle(document.documentElement).colorScheme === "dark";
  const [bg, ink, bad, badBg] = dark ? ["#141414", "#ededed", "#ff7a6b", "#2a1513"] : ["#ffffff", "#0f1729", "#c9271a", "#fdecea"];
  return `<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 14px 16px; background: ${bg}; color: ${ink};
         font: 13.5px/1.6 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  #zeno-error { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: ${badBg}; color: ${bad}; }
  #zeno-error:empty { display: none; }
</style></head><body>
<pre id="zeno-output"></pre>
<pre id="zeno-error"></pre>
</body></html>`;
}

// ------------------------------------------------------------- Zeno itself
// web.js is run here too, for `Zeno.unpacked`: the frame of each run gets
// a copy of its own. Zeno is unpacked and compiled once; the frames find
// it as `parent.zenoModule`.
new Function(WEB_JS)();
window.zenoModule = Zeno.unpacked(PACKED).then((bytes) => WebAssembly.compile(bytes));

// A Zeno of the playground's own, to check and format the program. It is
// given a page that says nothing: it only ever checks and lays out text.
let helper = null;
let heard = { printed: "", errors: [] };
async function zenoHelper() {
  if (helper) return helper;
  const module = await window.zenoModule;
  let exports;
  const read = (place, length) => new TextDecoder().decode(new Uint8Array(exports.memory.buffer, place, length));
  const instance = await WebAssembly.instantiate(module, { zeno: {
    zeno_host_print: (p, n) => { heard.printed += read(p, n); },
    zeno_host_error: (p, n) => { heard.errors.push(read(p, n)); },
    zeno_host_page: () => 0,
    zeno_host_input: () => 0,
    zeno_host_now: () => performance.now(),
  } });
  exports = instance.exports;
  helper = (name, source, ...more) => {
    heard = { printed: "", errors: [] };
    const bytes = new TextEncoder().encode(source);
    const place = exports.zeno_alloc(bytes.length);
    new Uint8Array(exports.memory.buffer, place, bytes.length).set(bytes);
    const result = exports[name](place, bytes.length, ...more) >>> 0;
    return { result, ...heard };
  };
  return helper;
}

// "error: `y` is not defined\n --> main.zeno:2:7\n ..." as its parts.
function parsed(error) {
  const at = /-->\s*([^:\s]+):(\d+):(\d+)/.exec(error);
  return {
    message: error.split("\n")[0].replace(/^error:\s*/, ""),
    line: at ? Number(at[2]) : 0,
    col: at ? Number(at[3]) : 0,
    text: error.trimEnd(),
  };
}

// --------------------------------------------------------- The two files
const files = { program: "", page: "" };
let editing = "program";

// ------------------------------------------------------------ Colouring
const KEYWORDS = new Set(("let var const function return if else for in while unsafe private interface owned take " +
  "strict break continue match case class enum try except raise raises assert as from import and or not is true false none").split(" "));
const BUILTINS = new Set("print len range input str int float bool type min max sum abs round sorted reversed enumerate zip any all".split(" "));

const TYPES = new Set("int float str bool u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 list dict".split(" "));

function escaped(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Zeno, one line at a time: no token goes past the end of a line.
const ZENO = /(#.*)|(f?"(?:\\.|[^"\\])*"?)|(\b0[xb][0-9a-fA-F_]+\b|\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)(\s*\()?/g;
function zenoLine(line) {
  let out = "", last = 0, m;
  ZENO.lastIndex = 0;
  while ((m = ZENO.exec(line))) {
    out += escaped(line.slice(last, m.index));
    last = ZENO.lastIndex;
    if (m[1]) out += `<span class="c">${escaped(m[1])}</span>`;
    else if (m[2]) {
      // An f-string: what is between { } is code, and is shown as code.
      let s = escaped(m[2]);
      if (m[2][0] === "f") s = s.replace(/\{([^{}]*)\}/g, '<span class="i">{$1}</span>');
      out += `<span class="s">${s}</span>`;
    } else if (m[3]) out += `<span class="n">${m[3]}</span>`;
    else {
      const word = m[4], call = m[5] || "";
      if (KEYWORDS.has(word)) out += `<span class="k">${word}</span>`;
      else if (/^[A-Z]/.test(word) || TYPES.has(word)) out += `<span class="t">${word}</span>`;
      else if (call || BUILTINS.has(word)) out += `<span class="f">${word}</span>`;
      else out += word;
      out += escaped(call);
    }
  }
  return out + escaped(line.slice(last));
}
// HTML: tags, attributes, strings and comments, roughly, also a line at a time.
const HTML = /(<!--.*?(?:-->|$))|(<\/?[A-Za-z][\w-]*)|("[^"]*"?|'[^']*'?)|(\b[\w-]+(?==))|(\/?>)/g;
function htmlLine(line) {
  let out = "", last = 0, m;
  HTML.lastIndex = 0;
  while ((m = HTML.exec(line))) {
    out += escaped(line.slice(last, m.index));
    last = HTML.lastIndex;
    const cls = m[1] ? "c" : m[2] || m[5] ? "k" : m[3] ? "s" : "t";
    out += `<span class="${cls}">${escaped(m[0])}</span>`;
    if (m[0] === "") HTML.lastIndex++;
  }
  return out + escaped(line.slice(last));
}

// Lines with a problem: from checking as you write, and from the last run.
let badLines = new Set();
let runLines = new Set();
function paint() {
  const lines = text.value.split("\n");
  const colour = editing === "program" ? zenoLine : htmlLine;
  const marks = editing === "program" ? new Set([...badLines, ...runLines]) : new Set();
  colours.innerHTML = lines.map((line, i) =>
    `<span class="ln${marks.has(i + 1) ? " bad" : ""}">${colour(line) || " "}</span>`).join("");
  const here = currentLine();
  gutter.innerHTML = lines.map((_, i) =>
    `<div class="${marks.has(i + 1) ? "bad" : ""}${i + 1 === here ? " here" : ""}">${i + 1}</div>`).join("");
  scrolled();
}
function scrolled() {
  colours.style.transform = `translate(${-text.scrollLeft}px, ${-text.scrollTop}px)`;
  gutter.scrollTop = text.scrollTop;
  // The coloured copy has to be as tall as the text, or the gutter cannot scroll as far.
  gutter.style.paddingBottom = (14 + text.offsetHeight) + "px";
}
function currentLine() {
  return text.value.slice(0, text.selectionStart).split("\n").length;
}
function showWhere() {
  const before = text.value.slice(0, text.selectionStart);
  const line = before.split("\n").length;
  $("where").textContent = `Ln ${line}, Col ${before.length - before.lastIndexOf("\n")}`;
  for (const div of gutter.children) div.classList.remove("here");
  if (gutter.children[line - 1]) gutter.children[line - 1].classList.add("here");
}

// ------------------------------------------------------- Checking as you write
let problems = [];
let checkTimer = 0;
function checkSoon() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(check, 350);
}
async function check() {
  const zeno = await zenoHelper();
  const { errors } = zeno("zeno_check", files.program);
  problems = errors.map(parsed);
  badLines = new Set(problems.map((p) => p.line).filter(Boolean));
  const count = problems.length;
  $("count").hidden = count === 0;
  $("count").textContent = count;
  const checked = $("checked");
  checked.className = count ? "no" : "ok";
  checked.textContent = count ? `● ${count} problem${count === 1 ? "" : "s"}` : "✓ No problems";
  const list = $("view-problems");
  list.innerHTML = count ? "" : '<div class="none">No problems. Zeno checked the program as you wrote it.</div>';
  for (const p of problems) {
    const row = document.createElement("button");
    row.className = "problem";
    row.innerHTML = `<b><em>${p.line ? "Ln " + p.line : ""}</em><span></span></b><pre></pre>`;
    row.querySelector("span").textContent = p.message;
    row.querySelector("pre").textContent = p.text.split("\n").slice(1).join("\n");
    row.addEventListener("click", () => goTo(p.line, p.col));
    list.appendChild(row);
  }
  if (editing === "program") paint();
}

// Put the cursor on a line of the program, and show where it is.
function goTo(line, col) {
  if (!line) return;
  if (editing !== "program") choose("program");
  showHalf("code");
  const lines = text.value.split("\n");
  let at = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) at += lines[i].length + 1;
  at += Math.max(0, (col || 1) - 1);
  text.focus();
  text.setSelectionRange(at, at);
  const lineHeight = parseFloat(getComputedStyle(text).lineHeight);
  text.scrollTop = Math.max(0, (line - 1) * lineHeight - text.clientHeight / 3);
  scrolled();
  showWhere();
  const row = colours.children[line - 1];
  if (row) { row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
}

// -------------------------------------------------------------- Running
// `<` written this way is the same text to JSON and nothing to the
// browser, which would read the closing tag of a script, written in a
// program, as the end of ours.
function quoted(value) {
  return JSON.stringify(value).replace(/</g, "\\u003c");
}
let ranAt = 0;
let runFailed = false;
window.zenoRunError = (error) => {
  runFailed = true;
  $("run-count").hidden = false;
  said.textContent = "Stopped with an error";
  const p = parsed(String(error));
  if (p.line) { runLines.add(p.line); if (editing === "program") paint(); }
};
window.zenoRan = () => {
  if (!runFailed) said.textContent = `Ran in ${Math.max(1, Math.round(performance.now() - ranAt))} ms`;
};
// A program is in the page that was written for it only if it uses one:
// a program that does not say `import web` cannot reach a page, and gets
// the page that shows what it prints (decisions 20.3).
function usesPage(program) {
  return /^\s*(import\s+web\b|from\s+web\s+import\b)/m.test(program);
}
function run() {
  files[editing] = text.value;
  saveSoon(true);
  runFailed = false;
  runLines = new Set();
  if (editing === "program") paint();
  $("run-count").hidden = true;
  said.textContent = "Running…";
  showTab("output");
  const program = { main: "main.zeno", files: { "main.zeno": files.program } };
  const own = files.page.trim() === "" || !usesPage(files.program) ? outputPage() : files.page;
  // The frame says when Zeno stopped with an error, which web.js writes
  // to the console, and when the program's first run is over.
  const scripts =
    "<script>(function(){var e=console.error;console.error=function(t){try{parent.zenoRunError(t)}catch(x){}" +
    "return e.apply(console,arguments)}})();<\/script>\n" +
    "<script>\n" + WEB_JS + "<\/script>\n" +
    "<script>Zeno.start(parent.zenoModule, " + quoted(program) + ").then(function(){parent.zenoRan()});<\/script>\n";
  const at = own.toLowerCase().lastIndexOf("</body>");
  ranAt = performance.now();
  frame.srcdoc = at < 0 ? own + scripts : own.slice(0, at) + scripts + own.slice(at);
  showHalf("result");
}

// ------------------------------------------------------------ Formatting
async function format() {
  if (editing !== "program") { toast("Format lays out Zeno, not the page"); return; }
  const zeno = await zenoHelper();
  const { result, printed } = zeno("zeno_format", files.program);
  if (result !== 0) {
    toast("Fix the problems first: a program with a mistake is not formatted");
    showTab("problems");
    showHalf("result");
    return;
  }
  if (printed === files.program) { toast("Already formatted"); return; }
  replaceAll(printed);
  toast("Formatted");
}

// Change the whole text in a way that Undo can take back.
function replaceAll(value) {
  text.focus();
  text.select();
  if (!document.execCommand("insertText", false, value)) text.value = value;
  text.setSelectionRange(0, 0);
  edited();
}

// ----------------------------------------------------------- Editing keys
function insert(value) {
  if (!document.execCommand("insertText", false, value)) {
    text.setRangeText(value, text.selectionStart, text.selectionEnd, "end");
    edited();
  }
}
// The lines the selection touches, changed by `change`, kept selected.
function eachLine(change) {
  const value = text.value;
  const start = value.lastIndexOf("\n", text.selectionStart - 1) + 1;
  let end = value.indexOf("\n", text.selectionEnd - (text.selectionEnd > text.selectionStart ? 1 : 0));
  if (end < 0) end = value.length;
  const before = value.slice(start, end);
  const after = change(before.split("\n")).join("\n");
  if (after === before) return;
  text.setSelectionRange(start, end);
  insert(after);
  text.setSelectionRange(start, start + after.length);
}
text.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === "Enter" && mod) { e.preventDefault(); run(); return; }
  if ((e.key === "F" || e.key === "f" || e.code === "KeyF") && e.shiftKey && e.altKey) { e.preventDefault(); format(); return; }
  if (e.key === "s" && mod) { e.preventDefault(); share(); return; }
  if (e.key === "/" && mod && editing === "program") {
    e.preventDefault();
    eachLine((lines) => {
      const all = lines.filter((l) => l.trim()).every((l) => /^\s*#/.test(l));
      return lines.map((l) => (!l.trim() ? l : all ? l.replace(/^(\s*)# ?/, "$1") : l.replace(/^(\s*)/, "$1# ")));
    });
    return;
  }
  if (e.key === "Tab" && !mod && !e.altKey) {
    e.preventDefault();
    const several = text.value.slice(text.selectionStart, text.selectionEnd).includes("\n");
    if (e.shiftKey) eachLine((lines) => lines.map((l) => l.replace(/^ {1,4}/, "")));
    else if (several) eachLine((lines) => lines.map((l) => (l ? "    " + l : l)));
    else insert("    ");
    return;
  }
  // A new line starts where the last one did, and one step in after `{`.
  if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
    e.preventDefault();
    const before = text.value.slice(0, text.selectionStart);
    const line = before.slice(before.lastIndexOf("\n") + 1);
    let indent = /^\s*/.exec(line)[0];
    const opens = /[{([]\s*$/.test(line);
    const closer = /^\s*[})\]]/.test(text.value.slice(text.selectionEnd));
    if (opens && closer) { insert("\n" + indent + "    \n" + indent); const at = text.selectionStart - indent.length - 1; text.setSelectionRange(at, at); return; }
    if (opens) indent += "    ";
    insert("\n" + indent);
    return;
  }
  // `}` on a line of spaces goes one step out.
  if (e.key === "}" && editing === "program") {
    const before = text.value.slice(0, text.selectionStart);
    const line = before.slice(before.lastIndexOf("\n") + 1);
    if (/^ {4,}$/.test(line) && text.selectionStart === text.selectionEnd) {
      e.preventDefault();
      text.setSelectionRange(text.selectionStart - 4, text.selectionStart);
      insert("}");
    }
  }
});

function edited() {
  files[editing] = text.value;
  if (editing === "program") { runLines = new Set(); checkSoon(); compileSoon(); }
  paint();
  showWhere();
  saveSoon();
}
text.addEventListener("input", edited);
text.addEventListener("scroll", scrolled);
for (const kind of ["keyup", "click", "select"]) text.addEventListener(kind, showWhere);
new ResizeObserver(scrolled).observe(text);

// ------------------------------------------------------------ The two files
function choose(which, keep = true) {
  if (keep) files[editing] = text.value;
  editing = which;
  $("tab-program").setAttribute("aria-selected", String(which === "program"));
  $("tab-page").setAttribute("aria-selected", String(which === "page"));
  text.value = files[which];
  text.setAttribute("aria-label", which === "program" ? "The program" : "The page, in HTML");
  if (which === "page" && !files.page) text.placeholder = "Empty: the program gets a page that shows what it prints.\nWrite HTML here for a program that says import web.";
  else text.placeholder = "";
  text.scrollTop = 0;
  text.setSelectionRange(0, 0);
  paint();
  showWhere();
}
$("tab-program").addEventListener("click", () => choose("program"));
$("tab-page").addEventListener("click", () => choose("page"));

let showing = "output";
function showTab(which) {
  showing = which;
  for (const name of ["output", "problems", "c"]) {
    $("tab-" + name).setAttribute("aria-selected", String(which === name));
    $("view-" + name).hidden = which !== name;
  }
  if (which === "c") compileSoon(0);
}
$("tab-output").addEventListener("click", () => showTab("output"));
$("tab-problems").addEventListener("click", () => showTab("problems"));
$("tab-c").addEventListener("click", () => showTab("c"));

// ------------------------------------------------------------- The C tab
// The program as `zeno build` writes it, by the same compiler, made again
// a moment after each change while the tab is open. The runtime, which is
// the same for every program, is left out unless asked for.
const C_KEYWORDS = new Set(("auto break case char const continue default do double else enum extern float for goto if " +
  "inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void " +
  "volatile while bool true false NULL").split(" "));
const C = /(\/\/.*|\/\*.*?(?:\*\/|$))|("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(^\s*#\s*\w+)|(\b0[xX][0-9a-fA-F]+[uUlL]*\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[uUlLfF]*\b)|([A-Za-z_]\w*)(\s*\()?/g;
function cLine(line, inComment) {
  // A comment that goes on over several lines is coloured as one.
  let out = "", rest = line;
  if (inComment.on) {
    const end = line.indexOf("*/");
    if (end < 0) return `<span class="c">${escaped(line)}</span>`;
    out = `<span class="c">${escaped(line.slice(0, end + 2))}</span>`;
    rest = line.slice(end + 2);
    inComment.on = false;
  }
  let last = 0, m;
  C.lastIndex = 0;
  while ((m = C.exec(rest))) {
    out += escaped(rest.slice(last, m.index));
    last = C.lastIndex;
    if (m[1]) { out += `<span class="c">${escaped(m[1])}</span>`; if (m[1].startsWith("/*") && !m[1].endsWith("*/")) inComment.on = true; }
    else if (m[2]) out += `<span class="s">${escaped(m[2])}</span>`;
    else if (m[3]) out += `<span class="p">${escaped(m[3])}</span>`;
    else if (m[4]) out += `<span class="n">${m[4]}</span>`;
    else {
      const word = m[5], call = m[6] || "";
      if (C_KEYWORDS.has(word)) out += `<span class="k">${word}</span>`;
      else if (/_t$|^Zeno[A-Z]|^[A-Z]\w*[a-z]/.test(word)) out += `<span class="t">${word}</span>`;
      else if (call) out += `<span class="f">${word}</span>`;
      else out += word;
      out += escaped(call);
    }
    if (m[0] === "") C.lastIndex++;
  }
  return out + escaped(rest.slice(last));
}

let build = 0;
let lastC = { key: "", text: "", runtime: 0, errors: [] };
let compileTimer = 0;
function compileSoon(wait = 500) {
  if (showing !== "c") return;
  clearTimeout(compileTimer);
  compileTimer = setTimeout(compileC, wait);
}
async function compileC() {
  const zeno = await zenoHelper();
  const key = build + "\n" + files.program;
  if (lastC.key !== key) {
    const { result, printed, errors } = zeno("zeno_c", files.program, build);
    lastC = { key, text: printed, runtime: result === 4294967295 ? -1 : result, errors };
  }
  const box = $("c-code");
  if (lastC.runtime < 0) {
    const flags = ["", " --firmware", " --no-collector"][build];
    box.innerHTML = `<div class="c-note"><code>zeno build${flags}</code> cannot compile this program to C. It says:<pre></pre></div>`;
    box.querySelector("pre").textContent = lastC.errors.map((e) => e.trimEnd()).join("\n\n");
    return;
  }
  const lines = lastC.text.replace(/\n$/, "").split("\n");
  const withRuntime = $("with-runtime").checked;
  const first = withRuntime ? 0 : lastC.runtime;
  const shown = lines.slice(first);
  const state = { on: false };
  const coloured = shown.map((line) => cLine(line, state) || " ");
  box.innerHTML = `<div class="gutter">${shown.map((_, i) => `<div>${first + i + 1}</div>`).join("")}</div><pre>${coloured.join("\n")}</pre>`;
  $("with-runtime").parentElement.title = `The runtime: ${lastC.runtime} lines that every program starts with`;
  $("with-runtime").nextSibling.textContent = ` Runtime (${lastC.runtime} lines)`;
}
for (const n of [0, 1, 2]) {
  $("build-" + n).addEventListener("click", () => {
    build = n;
    for (const m of [0, 1, 2]) $("build-" + m).setAttribute("aria-pressed", String(m === n));
    compileC();
  });
}
$("with-runtime").addEventListener("change", compileC);
$("copy-c").addEventListener("click", () => {
  if (lastC.runtime < 0) { toast("There is no C to copy: the program has problems"); return; }
  const copied = () => toast("The whole C file is copied, runtime and all");
  if (navigator.clipboard) navigator.clipboard.writeText(lastC.text).then(copied, () => toast("The browser would not copy"));
});
$("checked").addEventListener("click", () => { showTab("problems"); showHalf("result"); });

// On a phone one half shows at a time.
function showHalf(which) {
  document.body.dataset.show = which;
  $("show-code").setAttribute("aria-selected", String(which === "code"));
  $("show-result").setAttribute("aria-selected", String(which === "result"));
}
$("show-code").addEventListener("click", () => showHalf("code"));
$("show-result").addEventListener("click", () => showHalf("result"));

// ------------------------------------------------------------- Examples
let current = null;
function load(example) {
  current = example;
  files.program = example.program;
  files.page = example.page || "";
  $("example-name").textContent = example.name;
  const was = showing;
  choose("program", false);
  check();
  run();
  if (was === "c") showTab("c");
  showHalf("code");
}
(function () {
  const list = $("examples");
  let group = null;
  EXAMPLES.forEach((example) => {
    if (example.group !== group) {
      group = example.group;
      const h = document.createElement("h3");
      h.textContent = group;
      list.appendChild(h);
    }
    const item = document.createElement("button");
    item.setAttribute("role", "menuitem");
    item.innerHTML = "<b></b><small></small>";
    item.querySelector("b").textContent = example.name;
    item.querySelector("small").textContent = example.about;
    item.addEventListener("click", () => { closeMenu(); load(example); history.replaceState(null, "", location.pathname); });
    list.appendChild(item);
  });
})();
function closeMenu() { $("menu").classList.remove("open"); $("menu-button").setAttribute("aria-expanded", "false"); }
$("menu-button").addEventListener("click", (e) => {
  e.stopPropagation();
  const open = $("menu").classList.toggle("open");
  $("menu-button").setAttribute("aria-expanded", String(open));
  if (open) $("examples").querySelector("button").focus();
});
document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) closeMenu(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeMenu();
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && document.activeElement !== text) { e.preventDefault(); run(); }
});
$("examples").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = [...$("examples").querySelectorAll("button")];
  const at = items.indexOf(document.activeElement);
  items[(at + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
});

// ------------------------------------------------------- Sharing and keeping
// A program in the address of the page: JSON, in base64 that an address
// can hold. What follows `#` is never sent anywhere.
function packed(what) {
  const bytes = new TextEncoder().encode(JSON.stringify(what));
  let s = "";
  bytes.forEach((b) => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromAddress() {
  try {
    const s = atob(location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/"));
    const what = JSON.parse(new TextDecoder().decode(Uint8Array.from(s, (c) => c.charCodeAt(0))));
    return typeof what.program === "string" ? what : null;
  } catch (unreadable) {
    return null;
  }
}
function share() {
  files[editing] = text.value;
  const link = location.href.split("#")[0] + "#" + packed({ program: files.program, page: files.page });
  history.replaceState(null, "", link);
  const done = () => toast("Link copied: it opens this program");
  if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => toast("The link is in the address bar"));
  else toast("The link is in the address bar");
}
$("share").addEventListener("click", share);

// What was written is kept in this browser, for the next visit.
let saveTimer = 0;
function saveSoon(now) {
  clearTimeout(saveTimer);
  const save = () => { try { localStorage.setItem("zeno-playground", JSON.stringify(files)); } catch (e) {} };
  if (now) save(); else saveTimer = setTimeout(save, 500);
}
function kept() {
  try {
    const what = JSON.parse(localStorage.getItem("zeno-playground"));
    return what && typeof what.program === "string" && what.program.trim() ? what : null;
  } catch (e) {
    return null;
  }
}

let toastTimer = 0;
function toast(message) {
  const t = $("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ------------------------------------------------------------ The rest
$("run").addEventListener("click", run);
$("format").addEventListener("click", format);
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  if (!files.page.trim()) run();
});

// Dragging the line between the halves.
(function () {
  const divider = $("divider"), code = $("code"), main = document.querySelector("main");
  divider.addEventListener("pointerdown", (e) => {
    divider.setPointerCapture(e.pointerId);
    divider.classList.add("dragging");
    frame.style.pointerEvents = "none";
  });
  divider.addEventListener("pointermove", (e) => {
    if (!divider.classList.contains("dragging")) return;
    const box = main.getBoundingClientRect();
    const share = Math.min(0.8, Math.max(0.2, (e.clientX - box.left) / box.width));
    code.style.flex = `0 0 calc(${share * 100}% - 6px)`;
    scrolled();
  });
  const stop = () => { divider.classList.remove("dragging"); frame.style.pointerEvents = ""; };
  divider.addEventListener("pointerup", stop);
  divider.addEventListener("pointercancel", stop);
})();

const start = fromAddress() || kept();
if (start) {
  files.program = start.program;
  files.page = start.page || "";
  $("example-name").textContent = fromAddress() ? "Shared program" : "Your program";
  choose("program", false);
  check();
  run();
  showHalf("code");
} else {
  load(EXAMPLES[0]);
}
window.zenoModule.then(() => { if (said.textContent === "Loading Zeno…") said.textContent = ""; },
  () => { said.textContent = "This browser cannot run Zeno"; });
</script>
</body>
</html>
