// ------------------------------------------------------------- Zeno itself
// web.js is run here too, for `Zeno.unpacked`: the frame of each run gets
// a copy of its own. Zeno is unpacked and compiled once; the frames find
// it as `parent.zenoModule`.
new Function(WEB_JS)();
window.zenoModule = Zeno.unpacked(PACKED).then((bytes) => WebAssembly.compile(bytes));

// A Zeno of the playground's own, to check and format the program. It is
// given a page that says nothing: it only ever checks and lays out text.
let helper = null;
let heard = { printed: "", errors: [] };
async function zenoHelper() {
  if (helper) return helper;
  const module = await window.zenoModule;
  let exports;
  const read = (place, length) => new TextDecoder().decode(new Uint8Array(exports.memory.buffer, place, length));
  const instance = await WebAssembly.instantiate(module, { zeno: {
    zeno_host_print: (p, n) => { heard.printed += read(p, n); },
    zeno_host_error: (p, n) => { heard.errors.push(read(p, n)); },
    zeno_host_page: () => 0,
    zeno_host_input: () => 0,
    zeno_host_now: () => performance.now(),
  } });
  exports = instance.exports;
  helper = (name, source, ...more) => {
    heard = { printed: "", errors: [] };
    const bytes = new TextEncoder().encode(source);
    const place = exports.zeno_alloc(bytes.length);
    new Uint8Array(exports.memory.buffer, place, bytes.length).set(bytes);
    const result = exports[name](place, bytes.length, ...more) >>> 0;
    return { result, ...heard };
  };
  return helper;
}

// "error: `y` is not defined\n --> main.zeno:2:7\n ..." as its parts.
function parsed(error) {
  const at = /-->\s*([^:\s]+):(\d+):(\d+)/.exec(error);
  return {
    message: error.split("\n")[0].replace(/^error:\s*/, ""),
    line: at ? Number(at[2]) : 0,
    col: at ? Number(at[3]) : 0,
    text: error.trimEnd(),
  };
}

// --------------------------------------------------------- The two files
const files = { program: "", page: "" };
let editing = "program";

// ------------------------------------------------------------ Colouring
const KEYWORDS = new Set(("let var const function return if else for in while unsafe private interface owned take " +
  "strict break continue match case class enum try except raise raises assert as from import and or not is true false none").split(" "));
const BUILTINS = new Set("print len range input str int float bool type min max sum abs round sorted reversed enumerate zip any all".split(" "));

const TYPES = new Set("int float str bool u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 list dict".split(" "));

function escaped(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Zeno, one line at a time: no token goes past the end of a line.
const ZENO = /(#.*)|(f?"(?:\\.|[^"\\])*"?)|(\b0[xb][0-9a-fA-F_]+\b|\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)(\s*\()?/g;
function zenoLine(line) {
  let out = "", last = 0, m;
  ZENO.lastIndex = 0;
  while ((m = ZENO.exec(line))) {
    out += escaped(line.slice(last, m.index));
    last = ZENO.lastIndex;
    if (m[1]) out += `<span class="c">${escaped(m[1])}</span>`;
    else if (m[2]) {
      // An f-string: what is between { } is code, and is shown as code.
      let s = escaped(m[2]);
      if (m[2][0] === "f") s = s.replace(/\{([^{}]*)\}/g, '<span class="i">{$1}</span>');
      out += `<span class="s">${s}</span>`;
    } else if (m[3]) out += `<span class="n">${m[3]}</span>`;
    else {
      const word = m[4], call = m[5] || "";
      if (KEYWORDS.has(word)) out += `<span class="k">${word}</span>`;
      else if (/^[A-Z]/.test(word) || TYPES.has(word)) out += `<span class="t">${word}</span>`;
      else if (call || BUILTINS.has(word)) out += `<span class="f">${word}</span>`;
      else out += word;
      out += escaped(call);
    }
  }
  return out + escaped(line.slice(last));
}
// HTML: tags, attributes, strings and comments, roughly, also a line at a time.
const HTML = /(<!--.*?(?:-->|$))|(<\/?[A-Za-z][\w-]*)|("[^"]*"?|'[^']*'?)|(\b[\w-]+(?==))|(\/?>)/g;
function htmlLine(line) {
  let out = "", last = 0, m;
  HTML.lastIndex = 0;
  while ((m = HTML.exec(line))) {
    out += escaped(line.slice(last, m.index));
    last = HTML.lastIndex;
    const cls = m[1] ? "c" : m[2] || m[5] ? "k" : m[3] ? "s" : "t";
    out += `<span class="${cls}">${escaped(m[0])}</span>`;
    if (m[0] === "") HTML.lastIndex++;
  }
  return out + escaped(line.slice(last));
}

// Lines with a problem: from checking as you write, and from the last run.
let badLines = new Set();
let runLines = new Set();
function paint() {
  const lines = text.value.split("\n");
  const colour = editing === "program" ? zenoLine : htmlLine;
  const marks = editing === "program" ? new Set([...badLines, ...runLines]) : new Set();
  colours.innerHTML = lines.map((line, i) =>
    `<span class="ln${marks.has(i + 1) ? " bad" : ""}">${colour(line) || " "}</span>`).join("");
  const here = currentLine();
  gutter.innerHTML = lines.map((_, i) =>
    `<div class="${marks.has(i + 1) ? "bad" : ""}${i + 1 === here ? " here" : ""}">${i + 1}</div>`).join("");
  scrolled();
}
function scrolled() {
  colours.style.transform = `translate(${-text.scrollLeft}px, ${-text.scrollTop}px)`;
  gutter.scrollTop = text.scrollTop;
  // The coloured copy has to be as tall as the text, or the gutter cannot scroll as far.
  gutter.style.paddingBottom = (14 + text.offsetHeight) + "px";
}
function currentLine() {
  return text.value.slice(0, text.selectionStart).split("\n").length;
}
function showWhere() {
  const before = text.value.slice(0, text.selectionStart);
  const line = before.split("\n").length;
  $("where").textContent = `Ln ${line}, Col ${before.length - before.lastIndexOf("\n")}`;
  for (const div of gutter.children) div.classList.remove("here");
  if (gutter.children[line - 1]) gutter.children[line - 1].classList.add("here");
}

// ------------------------------------------------------- Checking as you write
let problems = [];
let checkTimer = 0;
function checkSoon() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(check, 350);
}
async function check() {
  const zeno = await zenoHelper();
  const { errors } = zeno("zeno_check", files.program);
  problems = errors.map(parsed);
  badLines = new Set(problems.map((p) => p.line).filter(Boolean));
  const count = problems.length;
  $("count").hidden = count === 0;
  $("count").textContent = count;
  const checked = $("checked");
  checked.className = count ? "no" : "ok";
  checked.textContent = count ? `● ${count} problem${count === 1 ? "" : "s"}` : "✓ No problems";
  const list = $("view-problems");
  list.innerHTML = count ? "" : '<div class="none">No problems. Zeno checked the program as you wrote it.</div>';
  for (const p of problems) {
    const row = document.createElement("button");
    row.className = "problem";
    row.innerHTML = `<b><em>${p.line ? "Ln " + p.line : ""}</em><span></span></b><pre></pre>`;
    row.querySelector("span").textContent = p.message;
    row.querySelector("pre").textContent = p.text.split("\n").slice(1).join("\n");
    row.addEventListener("click", () => goTo(p.line, p.col));
    list.appendChild(row);
  }
  if (editing === "program") paint();
}

// Put the cursor on a line of the program, and show where it is.
function goTo(line, col) {
  if (!line) return;
  if (editing !== "program") choose("program");
  showHalf("code");
  const lines = text.value.split("\n");
  let at = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) at += lines[i].length + 1;
  at += Math.max(0, (col || 1) - 1);
  text.focus();
  text.setSelectionRange(at, at);
  const lineHeight = parseFloat(getComputedStyle(text).lineHeight);
  text.scrollTop = Math.max(0, (line - 1) * lineHeight - text.clientHeight / 3);
  scrolled();
  showWhere();
  const row = colours.children[line - 1];
  if (row) { row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
}

// -------------------------------------------------------------- Running
// `<` written this way is the same text to JSON and nothing to the
// browser, which would read the closing tag of a script, written in a
// program, as the end of ours.
function quoted(value) {
  return JSON.stringify(value).replace(/</g, "\\u003c");
}
let ranAt = 0;
let runFailed = false;
window.zenoRunError = (error) => {
  runFailed = true;
  $("run-count").hidden = false;
  said.textContent = "Stopped with an error";
  const p = parsed(String(error));
  if (p.line) { runLines.add(p.line); if (editing === "program") paint(); }
};
window.zenoRan = () => {
  if (!runFailed) said.textContent = `Ran in ${Math.max(1, Math.round(performance.now() - ranAt))} ms`;
};
// A program is in the page that was written for it only if it uses one:
// a program that does not say `import web` cannot reach a page, and gets
// the page that shows what it prints (decisions 20.3).
function usesPage(program) {
  return /^\s*(import\s+web\b|from\s+web\s+import\b)/m.test(program);
}
function run() {
  files[editing] = text.value;
  saveSoon(true);
  runFailed = false;
  runLines = new Set();
  if (editing === "program") paint();
  $("run-count").hidden = true;
  said.textContent = "Running…";
  showTab("output");
  const program = { main: "main.zeno", files: { "main.zeno": files.program } };
  const own = files.page.trim() === "" || !usesPage(files.program) ? outputPage() : files.page;
  // The frame says when Zeno stopped with an error, which web.js writes
  // to the console, and when the program's first run is over.
  const scripts =
    "<script>(function(){var e=console.error;console.error=function(t){try{parent.zenoRunError(t)}catch(x){}" +
    "return e.apply(console,arguments)}})();<\/script>\n" +
    "<script>\n" + WEB_JS + "<\/script>\n" +
    "<script>Zeno.start(parent.zenoModule, " + quoted(program) + ").then(function(){parent.zenoRan()});<\/script>\n";
  const at = own.toLowerCase().lastIndexOf("</body>");
  ranAt = performance.now();
  frame.srcdoc = at < 0 ? own + scripts : own.slice(0, at) + scripts + own.slice(at);
  showHalf("result");
}

// ------------------------------------------------------------ Formatting
async function format() {
  if (editing !== "program") { toast("Format lays out Zeno, not the page"); return; }
  const zeno = await zenoHelper();
  const { result, printed } = zeno("zeno_format", files.program);
  if (result !== 0) {
    toast("Fix the problems first: a program with a mistake is not formatted");
    showTab("problems");
    showHalf("result");
    return;
  }
  if (printed === files.program) { toast("Already formatted"); return; }
  replaceAll(printed);
  toast("Formatted");
}

// Change the whole text in a way that Undo can take back.
function replaceAll(value) {
  text.focus();
  text.select();
  if (!document.execCommand("insertText", false, value)) text.value = value;
  text.setSelectionRange(0, 0);
  edited();
}

// ----------------------------------------------------------- Editing keys
function insert(value) {
  if (!document.execCommand("insertText", false, value)) {
    text.setRangeText(value, text.selectionStart, text.selectionEnd, "end");
    edited();
  }
}
// The lines the selection touches, changed by `change`, kept selected.
function eachLine(change) {
  const value = text.value;
  const start = value.lastIndexOf("\n", text.selectionStart - 1) + 1;
  let end = value.indexOf("\n", text.selectionEnd - (text.selectionEnd > text.selectionStart ? 1 : 0));
  if (end < 0) end = value.length;
  const before = value.slice(start, end);
  const after = change(before.split("\n")).join("\n");
  if (after === before) return;
  text.setSelectionRange(start, end);
  insert(after);
  text.setSelectionRange(start, start + after.length);
}
text.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === "Enter" && mod) { e.preventDefault(); run(); return; }
  if ((e.key === "F" || e.key === "f" || e.code === "KeyF") && e.shiftKey && e.altKey) { e.preventDefault(); format(); return; }
  if (e.key === "s" && mod) { e.preventDefault(); share(); return; }
  if (e.key === "/" && mod && editing === "program") {
    e.preventDefault();
    eachLine((lines) => {
      const all = lines.filter((l) => l.trim()).every((l) => /^\s*#/.test(l));
      return lines.map((l) => (!l.trim() ? l : all ? l.replace(/^(\s*)# ?/, "$1") : l.replace(/^(\s*)/, "$1# ")));
    });
    return;
  }
  if (e.key === "Tab" && !mod && !e.altKey) {
    e.preventDefault();
    const several = text.value.slice(text.selectionStart, text.selectionEnd).includes("\n");
    if (e.shiftKey) eachLine((lines) => lines.map((l) => l.replace(/^ {1,4}/, "")));
    else if (several) eachLine((lines) => lines.map((l) => (l ? "    " + l : l)));
    else insert("    ");
    return;
  }
  // A new line starts where the last one did, and one step in after `{`.
  if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
    e.preventDefault();
    const before = text.value.slice(0, text.selectionStart);
    const line = before.slice(before.lastIndexOf("\n") + 1);
    let indent = /^\s*/.exec(line)[0];
    const opens = /[{([]\s*$/.test(line);
    const closer = /^\s*[})\]]/.test(text.value.slice(text.selectionEnd));
    if (opens && closer) { insert("\n" + indent + "    \n" + indent); const at = text.selectionStart - indent.length - 1; text.setSelectionRange(at, at); return; }
    if (opens) indent += "    ";
    insert("\n" + indent);
    return;
  }
  // `}` on a line of spaces goes one step out.
  if (e.key === "}" && editing === "program") {
    const before = text.value.slice(0, text.selectionStart);
    const line = before.slice(before.lastIndexOf("\n") + 1);
    if (/^ {4,}$/.test(line) && text.selectionStart === text.selectionEnd) {
      e.preventDefault();
      text.setSelectionRange(text.selectionStart - 4, text.selectionStart);
      insert("}");
    }
  }
});

function edited() {
  files[editing] = text.value;
  if (editing === "program") { runLines = new Set(); checkSoon(); compileSoon(); }
  paint();
  showWhere();
  saveSoon();
}
text.addEventListener("input", edited);
text.addEventListener("scroll", scrolled);
for (const kind of ["keyup", "click", "select"]) text.addEventListener(kind, showWhere);
new ResizeObserver(scrolled).observe(text);

// ------------------------------------------------------------ The two files
function choose(which, keep = true) {
  if (keep) files[editing] = text.value;
  editing = which;
  $("tab-program").setAttribute("aria-selected", String(which === "program"));
  $("tab-page").setAttribute("aria-selected", String(which === "page"));
  text.value = files[which];
  text.setAttribute("aria-label", which === "program" ? "The program" : "The page, in HTML");
  if (which === "page" && !files.page) text.placeholder = "Empty: the program gets a page that shows what it prints.\nWrite HTML here for a program that says import web.";
  else text.placeholder = "";
  text.scrollTop = 0;
  text.setSelectionRange(0, 0);
  paint();
  showWhere();
}
$("tab-program").addEventListener("click", () => choose("program"));
$("tab-page").addEventListener("click", () => choose("page"));

let showing = "output";
function showTab(which) {
  showing = which;
  for (const name of ["output", "problems", "c"]) {
    $("tab-" + name).setAttribute("aria-selected", String(which === name));
    $("view-" + name).hidden = which !== name;
  }
  if (which === "c") compileSoon(0);
}
$("tab-output").addEventListener("click", () => showTab("output"));
$("tab-problems").addEventListener("click", () => showTab("problems"));
$("tab-c").addEventListener("click", () => showTab("c"));

// ------------------------------------------------------------- The C tab
// The program as `zeno build` writes it, by the same compiler, made again
// a moment after each change while the tab is open. The runtime, which is
// the same for every program, is left out unless asked for.
const C_KEYWORDS = new Set(("auto break case char const continue default do double else enum extern float for goto if " +
  "inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void " +
  "volatile while bool true false NULL").split(" "));
const C = /(\/\/.*|\/\*.*?(?:\*\/|$))|("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(^\s*#\s*\w+)|(\b0[xX][0-9a-fA-F]+[uUlL]*\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[uUlLfF]*\b)|([A-Za-z_]\w*)(\s*\()?/g;
function cLine(line, inComment) {
  // A comment that goes on over several lines is coloured as one.
  let out = "", rest = line;
  if (inComment.on) {
    const end = line.indexOf("*/");
    if (end < 0) return `<span class="c">${escaped(line)}</span>`;
    out = `<span class="c">${escaped(line.slice(0, end + 2))}</span>`;
    rest = line.slice(end + 2);
    inComment.on = false;
  }
  let last = 0, m;
  C.lastIndex = 0;
  while ((m = C.exec(rest))) {
    out += escaped(rest.slice(last, m.index));
    last = C.lastIndex;
    if (m[1]) { out += `<span class="c">${escaped(m[1])}</span>`; if (m[1].startsWith("/*") && !m[1].endsWith("*/")) inComment.on = true; }
    else if (m[2]) out += `<span class="s">${escaped(m[2])}</span>`;
    else if (m[3]) out += `<span class="p">${escaped(m[3])}</span>`;
    else if (m[4]) out += `<span class="n">${m[4]}</span>`;
    else {
      const word = m[5], call = m[6] || "";
      if (C_KEYWORDS.has(word)) out += `<span class="k">${word}</span>`;
      else if (/_t$|^Zeno[A-Z]|^[A-Z]\w*[a-z]/.test(word)) out += `<span class="t">${word}</span>`;
      else if (call) out += `<span class="f">${word}</span>`;
      else out += word;
      out += escaped(call);
    }
    if (m[0] === "") C.lastIndex++;
  }
  return out + escaped(rest.slice(last));
}

let build = 0;
let lastC = { key: "", text: "", runtime: 0, errors: [] };
let compileTimer = 0;
function compileSoon(wait = 500) {
  if (showing !== "c") return;
  clearTimeout(compileTimer);
  compileTimer = setTimeout(compileC, wait);
}
async function compileC() {
  const zeno = await zenoHelper();
  const key = build + "\n" + files.program;
  if (lastC.key !== key) {
    const { result, printed, errors } = zeno("zeno_c", files.program, build);
    lastC = { key, text: printed, runtime: result === 4294967295 ? -1 : result, errors };
  }
  const box = $("c-code");
  if (lastC.runtime < 0) {
    const flags = ["", " --firmware", " --no-collector"][build];
    box.innerHTML = `<div class="c-note"><code>zeno build${flags}</code> cannot compile this program to C. It says:<pre></pre></div>`;
    box.querySelector("pre").textContent = lastC.errors.map((e) => e.trimEnd()).join("\n\n");
    return;
  }
  const lines = lastC.text.replace(/\n$/, "").split("\n");
  const withRuntime = $("with-runtime").checked;
  const first = withRuntime ? 0 : lastC.runtime;
  const shown = lines.slice(first);
  const state = { on: false };
  const coloured = shown.map((line) => cLine(line, state) || " ");
  box.innerHTML = `<div class="gutter">${shown.map((_, i) => `<div>${first + i + 1}</div>`).join("")}</div><pre>${coloured.join("\n")}</pre>`;
  $("with-runtime").parentElement.title = `The runtime: ${lastC.runtime} lines that every program starts with`;
  $("with-runtime").nextSibling.textContent = ` Runtime (${lastC.runtime} lines)`;
}
for (const n of [0, 1, 2]) {
  $("build-" + n).addEventListener("click", () => {
    build = n;
    for (const m of [0, 1, 2]) $("build-" + m).setAttribute("aria-pressed", String(m === n));
    compileC();
  });
}
$("with-runtime").addEventListener("change", compileC);
$("copy-c").addEventListener("click", () => {
  if (lastC.runtime < 0) { toast("There is no C to copy: the program has problems"); return; }
  const copied = () => toast("The whole C file is copied, runtime and all");
  if (navigator.clipboard) navigator.clipboard.writeText(lastC.text).then(copied, () => toast("The browser would not copy"));
});
$("checked").addEventListener("click", () => { showTab("problems"); showHalf("result"); });

// On a phone one half shows at a time.
function showHalf(which) {
  document.body.dataset.show = which;
  $("show-code").setAttribute("aria-selected", String(which === "code"));
  $("show-result").setAttribute("aria-selected", String(which === "result"));
}
$("show-code").addEventListener("click", () => showHalf("code"));
$("show-result").addEventListener("click", () => showHalf("result"));

// ------------------------------------------------------------- Examples
let current = null;
function load(example) {
  current = example;
  files.program = example.program;
  files.page = example.page || "";
  $("example-name").textContent = example.name;
  const was = showing;
  choose("program", false);
  check();
  run();
  if (was === "c") showTab("c");
  showHalf("code");
}
(function () {
  const list = $("examples");
  let group = null;
  EXAMPLES.forEach((example) => {
    if (example.group !== group) {
      group = example.group;
      const h = document.createElement("h3");
      h.textContent = group;
      list.appendChild(h);
    }
    const item = document.createElement("button");
    item.setAttribute("role", "menuitem");
    item.innerHTML = "<b></b><small></small>";
    item.querySelector("b").textContent = example.name;
    item.querySelector("small").textContent = example.about;
    item.addEventListener("click", () => { closeMenu(); load(example); history.replaceState(null, "", location.pathname); });
    list.appendChild(item);
  });
})();
function closeMenu() { $("menu").classList.remove("open"); $("menu-button").setAttribute("aria-expanded", "false"); }
$("menu-button").addEventListener("click", (e) => {
  e.stopPropagation();
  const open = $("menu").classList.toggle("open");
  $("menu-button").setAttribute("aria-expanded", String(open));
  if (open) $("examples").querySelector("button").focus();
});
document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) closeMenu(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeMenu();
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && document.activeElement !== text) { e.preventDefault(); run(); }
});
$("examples").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = [...$("examples").querySelectorAll("button")];
  const at = items.indexOf(document.activeElement);
  items[(at + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
});

// ------------------------------------------------------- Sharing and keeping
// A program in the address of the page: JSON, in base64 that an address
// can hold. What follows `#` is never sent anywhere.
function packed(what) {
  const bytes = new TextEncoder().encode(JSON.stringify(what));
  let s = "";
  bytes.forEach((b) => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromAddress() {
  try {
    const s = atob(location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/"));
    const what = JSON.parse(new TextDecoder().decode(Uint8Array.from(s, (c) => c.charCodeAt(0))));
    return typeof what.program === "string" ? what : null;
  } catch (unreadable) {
    return null;
  }
}
function share() {
  files[editing] = text.value;
  const link = location.href.split("#")[0] + "#" + packed({ program: files.program, page: files.page });
  history.replaceState(null, "", link);
  const done = () => toast("Link copied: it opens this program");
  if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => toast("The link is in the address bar"));
  else toast("The link is in the address bar");
}
$("share").addEventListener("click", share);

// What was written is kept in this browser, for the next visit.
let saveTimer = 0;
function saveSoon(now) {
  clearTimeout(saveTimer);
  const save = () => { try { localStorage.setItem("zeno-playground", JSON.stringify(files)); } catch (e) {} };
  if (now) save(); else saveTimer = setTimeout(save, 500);
}
function kept() {
  try {
    const what = JSON.parse(localStorage.getItem("zeno-playground"));
    return what && typeof what.program === "string" && what.program.trim() ? what : null;
  } catch (e) {
    return null;
  }
}

let toastTimer = 0;
function toast(message) {
  const t = $("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ------------------------------------------------------------ The rest
$("run").addEventListener("click", run);
$("format").addEventListener("click", format);
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  if (!files.page.trim()) run();
});

// Dragging the line between the halves.
(function () {
  const divider = $("divider"), code = $("code"), main = document.querySelector("main");
  divider.addEventListener("pointerdown", (e) => {
    divider.setPointerCapture(e.pointerId);
    divider.classList.add("dragging");
    frame.style.pointerEvents = "none";
  });
  divider.addEventListener("pointermove", (e) => {
    if (!divider.classList.contains("dragging")) return;
    const box = main.getBoundingClientRect();
    const share = Math.min(0.8, Math.max(0.2, (e.clientX - box.left) / box.width));
    code.style.flex = `0 0 calc(${share * 100}% - 6px)`;
    scrolled();
  });
  const stop = () => { divider.classList.remove("dragging"); frame.style.pointerEvents = ""; };
  divider.addEventListener("pointerup", stop);
  divider.addEventListener("pointercancel", stop);
})();

const start = fromAddress() || kept();
if (start) {
  files.program = start.program;
  files.page = start.page || "";
  $("example-name").textContent = fromAddress() ? "Shared program" : "Your program";
  choose("program", false);
  check();
  run();
  showHalf("code");
} else {
  load(EXAMPLES[0]);
}
window.zenoModule.then(() => { if (said.textContent === "Loading Zeno…") said.textContent = ""; },
  () => { said.textContent = "This browser cannot run Zeno"; });
</script>
</body>
</html>
