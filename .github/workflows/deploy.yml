# Deploys the site to Cloudflare Pages (project "zeno-lang").
# It runs when a push to main has "[deploy]" in its commit message,
# or by hand from the Actions tab. A plain push does not deploy.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account,
# Cloudflare Pages, Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Gather the site, without the build tools
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude tools --exclude _site ./ _site/
      - name: Check the token and the account ID
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "token status: $(api /user/tokens/verify | jq -r '.result.status // .errors[0].message')"
          echo "account ID length: ${#ACCOUNT} (should be 32)"
          echo "accounts this token can see:"
          api /accounts | jq -r '.result[] | "  \(.name) matches_secret=\(.id == env.ACCOUNT)"'
          echo "pages projects under the secret's account:"
          api "/accounts/$ACCOUNT/pages/projects" | jq -r 'if .success then (.result[] | "  " + .name) else "  error: " + (.errors[0].message) end'
          # Whether this token could also set up mail for the domain
          # (Email Routing). It prints no address.
          zone=$(api "/zones?name=zeno-lang.org" | jq -r '.result[0].id // empty')
          if [ -n "$zone" ]; then
            echo "email routing: $(api "/zones/$zone/email/routing" | jq -r 'if .success then "enabled=\(.result.enabled) status=\(.result.status)" else "this token cannot read it: " + (.errors[0].message) end')"
            echo "email routing rules: $(api "/zones/$zone/email/routing/rules" | jq -r 'if .success then "\(.result | length) rule(s)" else "this token cannot read them: " + (.errors[0].message) end')"
          else
            echo "email routing: this token cannot see the zone zeno-lang.org"
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name zeno-lang --branch main
      - name: Check link previews as the crawlers see them
        run: |
          sleep 20
          for ua in "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" \
                    "WhatsApp/2.23.20.0" "Twitterbot/1.0" "LinkedInBot/1.0" \
                    "Slackbot-LinkExpanding 1.0 (+https://api.slack.com/robots)" "Discordbot/2.0" "TelegramBot (like TwitterBot)"; do
            page=$(curl -s -A "$ua" -w '\n%{http_code}' "https://zeno-lang.org/?preview=$GITHUB_RUN_ID")
            code=$(echo "$page" | tail -1)
            image=$(echo "$page" | grep -o 'property="og:image" content="[^"]*"' | cut -d'"' -f4)
            img=$(curl -s -A "$ua" -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$image")
            echo "$ua -> page $code, og:image ${image:-none} -> $img"
          done
          for path in playground/ benchmarks/ book/ download/; do
            echo "/$path -> $(curl -s -A 'facebookexternalhit/1.1' "https://zeno-lang.org/$path" | grep -o 'property="og:image" content="[^"]*"' | cut -d'"' -f4)"
          done
